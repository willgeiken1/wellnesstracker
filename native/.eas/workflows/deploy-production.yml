# Runs on Expo's servers when a change merges to main (Expo GitHub app, base directory `native`).
# Native code changed (new fingerprint): build the iPhone app and send it to TestFlight.
# Only JavaScript changed (a build with this fingerprint exists): publish an over-the-air update instead.
# No token lives in this repo: Expo uses the linked GitHub app and the App Store Connect key stored on Expo.
name: Deploy iOS to production

on:
  push:
    branches: ['main']
    # Repository-relative. The app also bundles the shared importer from supabase/functions/_shared.
    paths:
      - 'native/**'
      - 'supabase/functions/_shared/**'

# One deploy at a time; a newer merge waits for the running one instead of cancelling a build or upload.
concurrency:
  group: deploy-ios-production
  cancel_in_progress: false

jobs:
  fingerprint:
    name: Fingerprint native code
    type: fingerprint
    environment: production
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'

  get_ios_build:
    name: Find a build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # A build started by an earlier merge counts, so two quick merges don't build twice.
      wait_for_in_progress: true

  build_ios:
    name: Build iOS (production)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  publish_ios_update:
    name: Publish iOS update (production channel)
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
    params:
      channel: production
      platform: ios
