name: Tests

# --experimental-strip-types, used by tests/purge.test.mjs, needs Node 22.6+.
on:
  pull_request:
  push:

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Require Node 22.6 or newer
        run: node -e "const [M,m]=process.versions.node.split('.').map(Number); if(M<22||(M===22&&m<6)){console.error(process.version); process.exit(1)}"

      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Run tests
        run: |
          set -euo pipefail
          export PG_BIN="$(echo /usr/lib/postgresql/*/bin)"
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'quota.test.mjs' | sort)
          node --test "${files[@]}"
