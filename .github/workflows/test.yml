name: Tests

# --experimental-strip-types, used by tests that import the edge strip module, needs Node 22.6+.
on:
  pull_request:
  push:

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Require Node 22.6 or newer
        run: node -e "const [M,m]=process.versions.node.split('.').map(Number); if(M<22||(M===22&&m<6)){console.error(process.version); process.exit(1)}"

      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Run tests
        run: |
          set -euo pipefail
          export PG_BIN="$(echo /usr/lib/postgresql/*/bin)"
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'quota.test.mjs' | sort)
          node --experimental-strip-types --test "${files[@]}"

  browser:
    name: Browser harnesses
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install Playwright
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser harnesses
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/browser-artifacts
          HOME_MIGRATE_PG: "0"
          SHOTS: "0"
        run: bash logger/tests/run-browser.sh

  pr-smoke:
    name: PR smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run PR smoke
        env:
          PW_PROJECTS: iphone-webkit
        run: npm run pw:smoke

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-smoke-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
