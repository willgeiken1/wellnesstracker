name: Tests

# --experimental-strip-types, used by tests that import the edge strip module, needs Node 22.6+.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    # Throwaway database for tests/quota.test.mjs. Not a real secret.
    services:
      postgres:
        # postgres:16
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quota_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Require Node 22.6 or newer
        run: node -e "const [M,m]=process.versions.node.split('.').map(Number); if(M<22||(M===22&&m<6)){console.error(process.version); process.exit(1)}"

      # Food-estimate schema tests import zod. Skip dependency scripts; this job does not run Playwright.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Run tests
        run: |
          set -euo pipefail
          export PG_BIN="$(echo /usr/lib/postgresql/*/bin)"
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'quota.test.mjs' | sort)
          node --experimental-strip-types --test "${files[@]}"

      # The quota test calls psql against $QUOTA_DB. Supabase provides the API roles, auth.users,
      # auth.uid() and the storage tables; stub them, apply every migration in filename order,
      # and seed the two test users.
      - name: Load quota schema
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: quota_test
          PGOPTIONS: "-c client_min_messages=warning"
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin bypassrls; end if;
          end
          $roles$;
          -- Match Supabase's defaults: the API roles get everything unless a migration revokes it.
          grant usage on schema public to anon, authenticated, service_role;
          alter default privileges for role postgres in schema public grant all on tables to anon, authenticated, service_role;
          alter default privileges for role postgres in schema public grant all on functions to anon, authenticated, service_role;
          alter default privileges for role postgres in schema public grant all on sequences to anon, authenticated, service_role;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key, name text not null, public boolean default false,
            file_size_limit bigint, allowed_mime_types text[]
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text references storage.buckets (id), name text, owner uuid
          );
          create or replace function storage.foldername(name text) returns text[] language sql immutable
            as $$ select (string_to_array(name, '/'))[1:array_length(string_to_array(name, '/'), 1) - 1] $$;
          SQL
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -name '*.sql' | LC_ALL=C sort)
          test "${#migrations[@]}" -gt 0
          for f in "${migrations[@]}"; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -q -c "insert into auth.users (id) values ('11111111-1111-4111-8111-111111111111'), ('22222222-2222-4222-8222-222222222222') on conflict do nothing"
          # Fail here, not as a confusing test error, if the schema did not load.
          test "$(psql -t -A -c "select to_regprocedure('public.consume_ai_quota(uuid,date,text)') is not null")" = "t"

      - name: Run quota tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          QUOTA_DB: quota_test
        run: node --test tests/quota.test.mjs

  browser:
    name: Browser harnesses
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install Playwright
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser harnesses
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/browser-artifacts
          HOME_MIGRATE_PG: "0"
          SHOTS: "0"
        run: bash logger/tests/run-browser.sh

  pr-smoke:
    name: PR smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This job does not grant actions: write, so a cache save can be denied.
      # Restoring a hit still helps. A denied save must not fail the smoke run.
      # Playwright 1.63 extracts both the Ubuntu 24.04 and 26.04 WebKit builds
      # into webkit-<revision>. runner.os is Linux for both, so a 24.04 cache
      # hit makes `playwright install` skip the 26.04 zip. That binary needs
      # libicudata.so.74, which 26.04 does not ship. Key on the distro.
      - name: Read distro version
        id: distro
        run: |
          set -euo pipefail
          version_id=$(. /etc/os-release && printf '%s' "$VERSION_ID")
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.distro.outputs.version_id }}-playwright-1.63.0

      - name: Install WebKit
        run: |
          set -euo pipefail
          npx playwright install --with-deps webkit
          exe=$(node --input-type=commonjs -e "const {webkit}=require('playwright'); process.stdout.write(webkit.executablePath())")
          root=$(dirname "$exe")
          bin=$(find "$root" -type f -name MiniBrowser -print -quit)
          test -n "$bin"
          missing=$(ldd "$bin" | awk '/not found/ { print }' || true)
          if [[ -n "$missing" ]]; then
            echo "WebKit is missing shared libraries after install --with-deps:" >&2
            printf '%s\n' "$missing" >&2
            exit 1
          fi

      - name: Warn if supabase-js pin drifted from latest 2.x
        run: node logger/tests/e2e/check-supabase-pin.mjs

      - name: Run PR smoke
        env:
          PW_PROJECTS: iphone-webkit
        run: bash logger/tests/e2e/with-os-lock.sh npm run pw:smoke

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-smoke-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
