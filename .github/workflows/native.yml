name: Native scaffold

on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  check:
    name: Native typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: node --test plugins/*.test.js
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci

  plistbuddy:
    name: Native real PlistBuddy tests
    # Public willgeiken1/wellnesstracker: standard macOS runner minutes are free.
    # Keep this small (private repos incur higher macOS minute costs).
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native
    env:
      EXPO_NO_TELEMETRY: '1'
      REQUIRE_PLISTBUDDY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: node --test plugins/*.test.js
