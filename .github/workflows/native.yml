name: Native scaffold

on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  check:
    name: Native typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: node --test plugins/*.test.js
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci
      - name: Release bundle excludes the mock purchase provider
        run: |
          out="${RUNNER_TEMP}/plus-release"
          npx expo export --platform ios --output-dir "$out" --max-workers 2
          mapfile -t bundles < <(find "$out" -type f \( -name '*.hbc' -o -name '*.js' -o -name '*.jsbundle' \) ! -name '*.map')
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo 'No release bundle was exported' >&2
            exit 1
          fi
          if grep -a -E -n 'createMockPurchaseProvider|DEFAULT_MOCK_PRICING' "${bundles[@]}"; then
            echo 'Mock purchase provider leaked into the release bundle' >&2
            exit 1
          fi
      - name: Inspect free iPhone config and bundle
        run: npm run check:free-iphone

  plistbuddy:
    name: Native real PlistBuddy tests
    # Public willgeiken1/wellnesstracker: standard macOS runner minutes are free.
    # Keep this small (private repos incur higher macOS minute costs).
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native
    env:
      EXPO_NO_TELEMETRY: '1'
      REQUIRE_PLISTBUDDY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - name: Run plugin tests with real PlistBuddy
        run: node --test --test-skip-pattern="strict plutil round-trip" plugins/*.test.js
      - name: Strict pbxproj write/read and decoded Release/Debug execution
        shell: bash
        run: |
          node --test --test-reporter=tap --test-name-pattern="strict plutil round-trip" plugins/withStripLocalNetworkingRelease.test.js | tee "$RUNNER_TEMP/release-plist-tests.tap"
          # Node can exit successfully when a renamed selector matches no tests.
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/release-plist-tests.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/release-plist-tests.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/release-plist-tests.tap"
          grep -Eq '^# todo 0$' "$RUNNER_TEMP/release-plist-tests.tap"
