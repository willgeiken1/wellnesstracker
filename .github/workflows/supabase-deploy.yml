name: Deploy Supabase

# Deploys project pvodxxmfgflvgvbdotlv when supabase/ changes on main.
# Matches the manual deploy: link, db push --yes, functions deploy --no-verify-jwt --use-api.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
  workflow_dispatch:

# A second deploy waits. cancel-in-progress would stop a migration mid-push.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    # Manual runs from other branches would ship that branch to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: pvodxxmfgflvgvbdotlv
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.119.0

      - name: Show CLI version
        run: supabase --version

      - name: Require access token
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Repository secret SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Plan deploy
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GITHUB_OUTPUT:-}" ]; then
            echo "GITHUB_OUTPUT is not set."
            exit 1
          fi
          if [ -z "${EVENT_NAME:-}" ] || [ -z "${SHA:-}" ]; then
            echo "EVENT_NAME and SHA are required."
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "github.sha is not a commit SHA."
            exit 1
          fi

          migrations=false
          deploy_all=false
          declare -A selected=()

          mark_full() {
            migrations=true
            deploy_all=true
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: applying pending migrations and deploying every function."
            mark_full
          elif ! [[ "${BEFORE:-}" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable parent commit; applying pending migrations and deploying every function."
            mark_full
          elif ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            echo "Parent commit is not in this checkout; applying pending migrations and deploying every function."
            mark_full
          else
            diff_file=$(mktemp)
            trap 'rm -f "$diff_file"' EXIT
            if ! git diff --name-only -z "$BEFORE" "$SHA" >"$diff_file"; then
              echo "git diff failed."
              exit 1
            fi
            while IFS= read -r -d '' file; do
              case "$file" in
                supabase/migrations | supabase/migrations/*)
                  migrations=true
                  ;;
                supabase/functions/*)
                  rest="${file#supabase/functions/}"
                  name="${rest%%/*}"
                  if [ "$rest" = "$name" ] || [[ ! "$name" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
                    # A file directly under functions/, or a folder like _shared.
                    # Shared code is bundled into the functions, so redeploy them all.
                    deploy_all=true
                  else
                    selected["$name"]=1
                  fi
                  ;;
              esac
            done <"$diff_file"
          fi

          functions_out=""
          if [ "$deploy_all" = "false" ] && [ "${#selected[@]}" -gt 0 ]; then
            functions_out=$(printf '%s\n' "${!selected[@]}" | LC_ALL=C sort)
          fi

          {
            echo "migrations=${migrations}"
            echo "deploy_all=${deploy_all}"
            echo "functions<<end.functions"
            if [ -n "$functions_out" ]; then
              printf '%s\n' "$functions_out"
            fi
            echo "end.functions"
          } >>"$GITHUB_OUTPUT"

          echo "Plan: migrations=${migrations} deploy_all=${deploy_all}"
          if [ "$deploy_all" = "true" ]; then
            echo "Functions: all"
          elif [ -n "$functions_out" ]; then
            echo "Functions:"
            printf '%s\n' "$functions_out"
          else
            echo "Functions: none"
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Supabase deploy plan"
              echo ""
              echo "- Migrations: \`${migrations}\`"
              echo "- All functions: \`${deploy_all}\`"
              if [ "$deploy_all" = "true" ]; then
                echo "- Functions: all"
              elif [ -n "$functions_out" ]; then
                echo "- Functions:"
                while IFS= read -r name; do
                  echo "  - \`${name}\`"
                done <<< "$functions_out"
              else
                echo "- Functions: none"
              fi
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Push database migrations
        if: steps.plan.outputs.migrations == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            unset SUPABASE_DB_PASSWORD
            echo "Linking ${SUPABASE_PROJECT_REF} with the access token."
          else
            echo "Linking ${SUPABASE_PROJECT_REF} with SUPABASE_DB_PASSWORD set."
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --yes

      - name: Deploy functions
        if: steps.plan.outputs.deploy_all == 'true' || steps.plan.outputs.functions != ''
        env:
          DEPLOY_ALL: ${{ steps.plan.outputs.deploy_all }}
          FUNCTION_NAMES: ${{ steps.plan.outputs.functions }}
        run: |
          set -euo pipefail
          args=(functions deploy --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF")

          if [ "${DEPLOY_ALL}" = "true" ]; then
            echo "Deploying every function."
          else
            names=()
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              if [[ ! "$name" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
                echo "Unexpected function name in the deploy plan."
                exit 1
              fi
              if [ -f "supabase/functions/${name}/index.ts" ]; then
                names+=("$name")
              else
                echo "Skipping ${name}; it has no index.ts in this commit."
              fi
            done <<< "${FUNCTION_NAMES}"
            if [ "${#names[@]}" -eq 0 ]; then
              echo "No functions to deploy."
              exit 0
            fi
            echo "Deploying: ${names[*]}"
            args+=("${names[@]}")
          fi

          supabase "${args[@]}"
