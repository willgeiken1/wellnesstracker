name: Check row-sync on Supabase (read-only)

# Read-only comparison of project pvodxxmfgflvgvbdotlv with the reviewed row-sync
# plan. It changes nothing: both scripts run inside BEGIN TRANSACTION READ ONLY
# and end with ROLLBACK. Nothing runs on merge. Start it by hand from the Actions
# tab on main; the job then waits for Will's approval in the production
# environment, which holds the access token. It runs:
#   1. live/compare.sql: every column, default, forced RLS, policy, trigger,
#      index, API grant, the sequence and the four row-sync functions, listing
#      each difference as "missing" (in the plan, not live) or "unexpected".
#   2. live/verify.sql: the same safety checks the apply workflow ends with.
# Both outputs go to the run summary. The job fails if either finds a problem.

on:
  workflow_dispatch:

# Shares the deploy group so a migration push or apply never runs at the same time.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Compare live row-sync with the plan
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: pvodxxmfgflvgvbdotlv
      ROW_SYNC_DIR: native/server/row-sync
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Require access token
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Environment secret SUPABASE_ACCESS_TOKEN is not set in the production environment."
            exit 1
          fi

      - name: Link project
        id: link
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then unset SUPABASE_DB_PASSWORD; fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Compare with the plan (read-only)
        id: compare
        run: |
          set -uo pipefail
          supabase db query --linked -f "$ROW_SYNC_DIR/live/compare.sql" > "$RUNNER_TEMP/compare.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/compare.txt"
          exit $status

      - name: Verify safety checks (read-only)
        id: verify
        if: always() && steps.link.outcome == 'success'
        run: |
          set -uo pipefail
          supabase db query --linked -f "$ROW_SYNC_DIR/live/verify.sql" > "$RUNNER_TEMP/verify.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/verify.txt"
          exit $status

      - name: Record the check for the ledger
        if: always()
        run: |
          {
            echo "### Row-sync read-only check"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Compare: ${{ steps.compare.outcome }}"
            echo "- Verify: ${{ steps.verify.outcome }}"
            for f in compare verify; do
              if [ -f "$RUNNER_TEMP/$f.txt" ]; then
                echo "#### $f"
                echo '```'
                cat "$RUNNER_TEMP/$f.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
