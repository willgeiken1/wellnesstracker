<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insight">
<meta name="theme-color" content="#0F0F11">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #15171A;
  --surface: #1E2125;
  --raised: #282C31;
  --line: #2F343A;
  --text: #F2F3F5;
  --muted: #8E959E;
  --green: #2FD27A;
  --green-ink: #062B16;
  --green-soft: rgba(47, 210, 122, .14);
  --red: #FF5A4E;
  --muscle: #3A3E44;
  --skin: #2A2D31;
  --base: #2A2D31;
  --green-lo: #A6E3BF;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tabs-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 17px; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input { font: inherit; color: var(--text); -webkit-appearance: none; appearance: none; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; }

/* ---------- Shell ---------- */
#view { padding: calc(14px + var(--safe-top)) 16px calc(var(--tabs-h) + 110px + var(--safe-bottom)); max-width: 640px; margin: 0 auto; }
.page-title { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.05; }
.page-sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
.page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(21, 23, 26, .94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: var(--safe-bottom); }
.tab { height: var(--tabs-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 500; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--green); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: 12px; font-weight: 600; font-size: 17px; background: var(--raised); }
.btn:active { filter: brightness(.9); }
.btn.primary { background: var(--green); color: var(--green-ink); }
.btn.danger { color: var(--red); }
.btn.block { width: 100%; }
.btn.small { height: 40px; padding: 0 14px; font-size: 15px; border-radius: 10px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--text); }
.icon-btn:active { background: var(--raised); }
.icon-btn svg { width: 24px; height: 24px; }

.sec { margin-top: 30px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 12px; }
.sec-h h3 { font-family: var(--display); font-weight: 600; font-size: 24px; }
.sec-sub { color: var(--muted); font-size: 15px; }

/* ---------- Home: today ---------- */
.hero { background: var(--surface); border-radius: 18px; padding: 18px; border-left: 4px solid var(--green); }
.hero.quiet { border-left-color: var(--line); }
.hero-k { color: var(--muted); font-size: 15px; margin: 0; }
.hero-t { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; margin: 4px 0 6px; }
.hero-s { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--raised); font-weight: 600; }
.chip:active { background: var(--line); }

/* ---------- Home: week planner ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 10px; border-radius: 12px; background: var(--surface); min-width: 0; border: 1.5px solid transparent; }
.wk:disabled { cursor: default; }
.wk-d { font-size: 12px; color: var(--muted); }
.wk-n { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; }
.wk-w { font-size: 11.5px; font-weight: 600; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; min-height: 15px; }
.wk.today { border-color: var(--text); }
.wk.planned .wk-w { color: var(--text); }
.wk.done { background: var(--green-soft); }
.wk.done .wk-w { color: var(--green); }
.wk.past:not(.done) { opacity: .45; }
.week-nav { display: flex; gap: 2px; margin-right: -8px; align-items: center; }
.week-nav .goal-pill { margin-right: 4px; }
.week-nav .icon-btn { width: 36px; height: 36px; color: var(--muted); }

/* ---------- Home: muscles ---------- */
.bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--surface); border-radius: 18px; padding: 16px 8px 10px; }
.body-wrap { text-align: center; }
.body { width: 100%; max-width: 190px; height: auto; display: block; margin: 0 auto; }
.body-cap { color: var(--muted); font-size: 13px; margin-top: 6px; }
.body .base { fill: var(--base); }
.body .skin { fill: var(--skin); stroke: #111; stroke-width: .9; }
.body .mus { fill: var(--muscle); stroke: #111; stroke-width: .9; stroke-linejoin: round; cursor: pointer; transition: fill .3s; }
.body .mus.hit-lo { fill: var(--green-lo); }
.body .mus.hit { fill: var(--green); }
.body .line { stroke: #111; stroke-width: .9; fill: none; pointer-events: none; }
.body .detail { stroke: #111; stroke-width: .7; fill: none; stroke-linecap: round; pointer-events: none; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; margin: 14px 0 0; padding: 0; list-style: none; }
.mgrid li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--muted); }
.mgrid li.hit { color: var(--text); }
.mgrid li.hit b { color: var(--green); }
.mgrid li.hit-lo { color: var(--text); }
.mgrid li.hit-lo b { color: var(--green-lo); }
.legend { display: flex; gap: 16px; justify-content: center; color: var(--muted); font-size: 13px; padding: 4px 0 2px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--muscle); }
.legend i.lo { background: var(--green-lo); }
.legend i.hi { background: var(--green); }
.mgrid b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Workouts tab ---------- */
.wcard { display: grid; grid-template-columns: 1fr auto; align-items: center; width: 100%; text-align: left; background: var(--surface); border-radius: 16px; padding: 16px 12px 16px 18px; margin-bottom: 10px; }
.wcard:active { background: var(--raised); }
.wcard-t { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; }
.wcard-s { color: var(--muted); font-size: 14px; margin-top: 4px; line-height: 1.4; }
.chev { color: var(--muted); width: 22px; height: 22px; }

.detail-top { display: flex; align-items: center; justify-content: space-between; margin: -6px -8px 6px; }
.detail-actions { display: flex; gap: 4px; }
.link-btn { color: var(--muted); font-size: 15px; font-weight: 500; padding: 10px 8px; }
.link-btn.danger { color: var(--red); }
.elist { list-style: none; margin: 18px 0 0; padding: 0; position: relative; }
.erow { display: grid; grid-template-columns: 1fr 48px; align-items: center; background: var(--surface); border-radius: 14px; margin-bottom: 8px; position: relative; touch-action: pan-y; }
.erow.dragging { z-index: 3; background: var(--raised); box-shadow: 0 10px 28px rgba(0,0,0,.45); }
.erow.shifting { transition: transform .15s ease; }
.erow-main { text-align: left; padding: 14px 4px 14px 16px; min-width: 0; }
.erow-n { font-weight: 600; font-size: 17px; }
.erow-m { color: var(--muted); font-size: 14px; margin-top: 3px; }
.erow-m.none { color: var(--red); }
.handle { height: 100%; min-height: 56px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
.handle svg { width: 20px; height: 20px; }
.add-row-btn { width: 100%; height: 54px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--muted); font-weight: 600; }
.start-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + var(--safe-bottom)); padding: 12px 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 6; }
.start-bar .btn { max-width: 608px; margin: 0 auto; display: flex; }
body.timer-on:not(.in-workout) .start-bar { bottom: calc(var(--tabs-h) + var(--safe-bottom) + 78px); }
body.timer-on:not(.in-workout) #view { padding-bottom: calc(var(--tabs-h) + 190px + var(--safe-bottom)); }

/* ---------- History ---------- */
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { background: var(--surface); border-radius: 14px; margin-bottom: 8px; }
.hist summary { list-style: none; display: grid; grid-template-columns: 1fr auto; padding: 14px 16px; cursor: pointer; }
.hist summary::-webkit-details-marker { display: none; }
.hist-t { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.hist-d { color: var(--muted); font-size: 14px; margin-top: 2px; }
.hist-n { text-align: right; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.hist-n span { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); }
.hist-body { padding: 0 16px 14px; border-top: 1px solid var(--line); }
.hist-ex { padding: 10px 0 0; font-size: 15px; line-height: 1.45; }
.hist-ex b { font-weight: 600; display: block; }
.hist-ex span { color: var(--muted); }
.hist-body .link-btn { margin-top: 8px; padding-left: 0; }
.hist-actions { display: flex; justify-content: space-between; }

/* ---------- Settings ---------- */
.group { background: var(--surface); border-radius: 16px; padding: 4px 16px; margin-bottom: 14px; }
.set-row { display: flex; justify-content: space-between; align-items: center; min-height: 54px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); gap: 12px; }
.set-row:last-child { border-bottom: 0; }
.set-row .sub { color: var(--muted); font-size: 15px; }
.group-label { color: var(--muted); font-size: 14px; margin: 22px 4px 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 0; }
.seg button { height: 44px; border-radius: 10px; background: var(--raised); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.hint { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 10px 4px 0; }

/* ---------- Active workout ---------- */
#workout { position: fixed; inset: 0; z-index: 12; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(120px + var(--safe-bottom)); }
.wo-top { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; padding: calc(8px + var(--safe-top)) 12px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
.wo-title { min-width: 0; }
.wo-title h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#elapsed { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0 auto; padding: 0; max-width: 640px; }
.ex { border-bottom: 1px solid var(--line); }
.ex.open { background: var(--surface); }
.ex-head { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; padding: 14px 16px; align-items: center; }
.ex-name { font-family: var(--display); font-weight: 600; font-size: 23px; line-height: 1.15; }
.ex-last { grid-column: 1; color: var(--muted); font-size: 15px; margin-top: 3px; }
.ex-count { grid-row: 1 / span 2; grid-column: 2; min-width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 19px; background: var(--raised); color: var(--muted); }
.ex-count.has { background: var(--green); color: var(--green-ink); }
.panel { padding: 0 16px 18px; }
.sets { list-style: none; margin: 0 0 14px; padding: 0; border-top: 1px solid var(--line); }
.sets li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; min-height: 46px; border-bottom: 1px solid var(--line); column-gap: 8px; }
.set-n { color: var(--muted); font-family: var(--display); font-size: 18px; }
.set-v { font-family: var(--display); font-weight: 600; font-size: 22px; }
.set-note { grid-column: 2; color: var(--muted); font-size: 14px; margin: -8px 0 8px; }
.set-x { grid-row: 1; grid-column: 3; width: 40px; height: 40px; color: var(--muted); font-size: 22px; border-radius: 20px; }
.set-x:active { background: var(--raised); }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper label { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.step-row { display: grid; grid-template-columns: 46px 1fr 46px; height: 56px; background: var(--bg); border-radius: 12px; overflow: hidden; }
.step-row button { font-size: 26px; color: var(--muted); }
.step-row button:active { background: var(--raised); color: var(--text); }
.step-row input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-family: var(--display); font-weight: 700; font-size: 28px; padding: 0; }
.step-row input::placeholder { color: #5D646C; }
.note { width: 100%; margin-top: 12px; height: 48px; border-radius: 12px; border: 0; background: var(--bg); padding: 0 14px; font-size: 16px; }
.note::placeholder { color: #6E757D; }
.log { width: 100%; margin-top: 12px; height: 58px; border-radius: 14px; background: var(--green); color: var(--green-ink); font-family: var(--display); font-weight: 700; font-size: 24px; }
.log:active { filter: brightness(.9); }
.empty { padding: 28px 16px; color: var(--muted); line-height: 1.5; }

/* ---------- Rest timer ---------- */
#timer { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + var(--safe-bottom)); z-index: 14; background: var(--raised); padding: 0 16px 12px; box-shadow: 0 -1px 0 var(--line); }
body.in-workout #timer { bottom: 0; padding-bottom: calc(12px + var(--safe-bottom)); }
#timer-track { height: 4px; margin: 0 -16px 10px; background: var(--line); }
#timer-bar { height: 100%; background: var(--green); transform-origin: left; transition: transform .25s linear; }
.timer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 608px; margin: 0 auto; }
.timer-lbl { color: var(--muted); font-size: 13px; display: block; }
#timer-time { font-family: var(--display); font-weight: 700; font-size: 38px; font-variant-numeric: tabular-nums; line-height: 1; }
.timer-btns { display: flex; gap: 6px; }
.timer-btns button { height: 44px; min-width: 52px; padding: 0 10px; border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 16px; }
#timer.done { background: var(--green); color: var(--green-ink); }
#timer.done .timer-lbl { color: var(--green-ink); opacity: .7; }
#timer.done #timer-track { background: transparent; }
#timer.done .t-adj { display: none; }
#timer.done .timer-btns button { background: rgba(0,0,0,.14); color: var(--green-ink); }

/* ---------- Bottom sheet ---------- */
#sheet { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.sheet-card { position: relative; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 16px calc(18px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto; max-width: 640px; width: 100%; margin: 0 auto; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet-card h3 { font-family: var(--display); font-weight: 700; font-size: 28px; margin-bottom: 14px; }
.opt { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 54px; padding: 0 16px; border-radius: 12px; background: var(--raised); margin-bottom: 8px; font-weight: 600; text-align: left; }
.opt[aria-pressed="true"] { background: var(--green-soft); color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
.opt.clear { background: none; color: var(--red); justify-content: center; }
.field-label { display: block; color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.text-in { width: 100%; height: 50px; border-radius: 12px; border: 0; background: var(--bg); padding: 0 14px; font-size: 17px; margin-bottom: 16px; }
.mchips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
.mchip { height: 38px; padding: 0 14px; border-radius: 19px; background: var(--raised); font-size: 15px; font-weight: 500; }
.mchip[aria-pressed="true"] { background: var(--green); color: var(--green-ink); font-weight: 600; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn.primary { flex: 1; }

#dialog { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,.6); }
.dlg { width: 100%; max-width: 360px; background: var(--surface); border-radius: 18px; padding: 20px; }
.dlg h3 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; margin-bottom: 8px; }
.dlg p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 18px; }
.dlg .text-in { margin-bottom: 18px; }
.dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.danger-fill { background: var(--red); color: #fff; }
.wo-actions { display: flex; gap: 6px; }
.btn.small.cancel { background: rgba(255, 90, 78, .15); color: var(--red); }
#toast { display: flex; align-items: center; justify-content: center; gap: 14px; }
#toast { pointer-events: none; }
#toast button { font-weight: 700; color: #0A7A3D; padding: 4px 6px; pointer-events: auto; }
.sheet-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 18px; background: var(--raised); color: var(--muted); font-size: 20px; line-height: 1; }
/* ---------- Recovery + Insights ---------- */
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.seg2 button { height: 40px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.card h4 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0; }
.sub.small { font-size: 13px; margin-top: 8px; }
.card .btn { margin-top: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.demo-banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: rgba(242,193,46,.12); color: #F2C12E; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.demo-banner button { color: #F2C12E; font-weight: 700; white-space: nowrap; padding: 4px; }
.ready { display: grid; grid-template-columns: 108px 1fr; gap: 16px; align-items: center; }
.ring { width: 108px; height: 108px; }
.ring-bg { fill: none; stroke: var(--raised); stroke-width: 9; }
.ring-fg { fill: none; stroke: var(--green); stroke-width: 9; stroke-linecap: round; }
.ring.ok .ring-fg { stroke: var(--green-lo); } .ring.down .ring-fg { stroke: var(--red); }
.ring-v { fill: var(--text); font-family: var(--display); font-weight: 700; font-size: 34px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.card .stat, #sheet .stat { background: var(--raised); }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; }
.stat b small { font-size: 15px; color: var(--muted); font-weight: 600; }
.stat > span { color: var(--muted); font-size: 13px; }
.stages { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0; gap: 2px; }
.stages i, .legend2 i { display: block; height: 100%; }
.s-deep { background: #3D7BE0; } .s-rem { background: #8E7CF0; } .s-light { background: #7FB3F5; } .s-awake { background: #8E959E; }
.legend2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; color: var(--muted); }
.legend2 i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.range { display: flex; gap: 6px; }
.range button { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted); }
.range button[aria-pressed="true"] { background: var(--text); color: #111; }
.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.chart .ln { fill: none; stroke: var(--green); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.alt { stroke: #7FB3F5; } .chart .ln-dot { fill: var(--green); } .chart .ln.alt-dot { fill: #7FB3F5; }
.chart .bar { fill: var(--green); opacity: .85; } .chart .bar.soft { fill: #7FB3F5; opacity: .7; }
.mini-l { color: var(--muted); font-size: 13px; margin-top: 12px; }
.rcard { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.rcard-n { width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 24px; border: 4px solid var(--green); }
.rcard-n.ok { border-color: var(--green-lo); } .rcard-n.down { border-color: var(--red); }
.rcard-t { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); line-height: 1.35; }
.rcard-t b { color: var(--text); font-size: 16px; }
.rcard-s { font-size: 13px; }
.lifts { padding-top: 4px; padding-bottom: 4px; }
.lift { display: grid; grid-template-columns: 1fr 92px; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lift:last-child { border-bottom: 0; }
.lift > span { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.lift b { font-weight: 600; }
.lift-p { color: var(--muted); font-size: 13px; }
.chip-s { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; }
.chip-s.up { background: var(--green-soft); color: var(--green); }
.chip-s.flat { background: rgba(242,193,46,.14); color: #F2C12E; }
.chip-s.down { background: rgba(255,90,78,.14); color: var(--red); }
.chip-s.wait { background: var(--raised); color: var(--muted); }
.spark { width: 92px; height: 34px; } .spark path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke: var(--muted); }
.spark.up path { stroke: var(--green); } .spark.flat path { stroke: #F2C12E; } .spark.down path { stroke: var(--red); }
.cmp { display: grid; gap: 10px; margin-top: 14px; }
.cmp-row { display: grid; grid-template-columns: 118px 1fr 52px; align-items: center; gap: 8px; font-size: 14px; }
.cmp-bar { height: 12px; border-radius: 6px; background: var(--raised); position: relative; overflow: hidden; }
.cmp-bar i { position: absolute; top: 0; bottom: 0; } .cmp-bar i.pos { background: var(--green); } .cmp-bar i.neg { background: var(--red); }
.cmp-bar b { position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; background: var(--muted); }
.cmp-v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.vol { display: grid; gap: 8px; margin-top: 12px; }
.vol-row { display: grid; grid-template-columns: 96px 1fr 36px; gap: 8px; align-items: center; font-size: 14px; }
.vol-row b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.vol-bar { height: 10px; border-radius: 5px; background: var(--raised); position: relative; overflow: hidden; }
.vol-bar em { position: absolute; left: 40%; width: 40%; top: 0; bottom: 0; background: rgba(47,210,122,.16); }
.vol-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--muted); }
.vol-bar i.in { background: var(--green); } .vol-bar i.under { background: var(--green-lo); opacity: .7; } .vol-bar i.over { background: #F2C12E; }
.pp { margin-top: 12px; } .pp-bar { height: 12px; border-radius: 6px; background: #7FB3F5; overflow: hidden; } .pp-bar i { display: block; height: 100%; background: var(--green); }
.pp-l { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 6px; }
.warn { color: #F2C12E; }
#onboard { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ob-wrap { max-width: 520px; margin: 0 auto; padding: calc(22px + var(--safe-top)) 20px calc(30px + var(--safe-bottom)); }
.pf-seg { margin-bottom: 16px; }
.pf-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.pf-row .text-in { margin-bottom: 0; flex: 1; min-width: 0; }
.pf-row span { color: var(--muted); font-size: 15px; }
.norm { position: relative; height: 14px; border-radius: 7px; background: var(--raised); margin: 16px 0 6px; }
.norm-band { position: absolute; top: 0; bottom: 0; background: rgba(47,210,122,.25); border-radius: 7px; }
.norm-mid { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--green); }
.norm-you { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 8px; background: var(--text); border: 3px solid var(--bg); }
.norm-l { position: relative; height: 18px; font-size: 12px; color: var(--muted); }
.norm-l span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.wi-list { list-style: none; margin: 6px 0 0; padding: 0; }
.wi-list li { display: grid; grid-template-columns: 1fr auto 40px; align-items: center; min-height: 44px; border-bottom: 1px solid var(--line); font-size: 15px; }
.bw-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bw-top b { font-family: var(--display); font-weight: 700; font-size: 32px; }
.bw-top span { color: var(--muted); font-size: 14px; }
.nudge { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.nudge > span:first-child { font-size: 22px; text-align: center; }
.nudge b { display: block; font-size: 15px; } .nudge span span { color: var(--muted); font-size: 13px; }
.rel { color: var(--muted); font-size: 13px; }
.link-inline { color: var(--green); font-size: inherit; font-weight: 600; padding: 0; }
#toast { position: fixed; left: 16px; right: 16px; top: calc(12px + var(--safe-top)); z-index: 30; background: var(--text); color: #111; padding: 14px 16px; border-radius: 12px; font-weight: 500; text-align: center; max-width: 520px; margin: 0 auto; }

@media (prefers-reduced-motion: reduce) { #timer-bar, .body .mus, .erow.shifting { transition: none; } }

/* ================= Theme: pastel cards on near-black ================= */
:root {
  --bg: #0F0F11; --surface: #1B1B1F; --raised: #26262B; --line: #2C2C31;
  --text: #F4F4F1; --muted: #9B9BA1;
  --green: #D5F56B; --green-ink: #141414; --green-soft: rgba(213,245,107,.14); --green-lo: #EEF9C4;
  --lav: #C7B5FA; --pink: #F5BEDB; --ink: #141414; --red: #FF7B7B;
  --muscle: #34343A; --skin: #26262B; --base: #26262B;
  --display: "Lexend", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --body: "Manrope", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --tabs-h: 82px;
}
body { letter-spacing: -.005em; }
.page-title { font-weight: 600; font-size: 30px; letter-spacing: -.03em; line-height: 1.1; }
.page-sub { font-size: 14px; margin-top: 4px; }
.sec-h h3 { font-weight: 600; font-size: 19px; letter-spacing: -.02em; }
.card { border-radius: 24px; }
.card h4 { font-weight: 600; font-size: 18px; letter-spacing: -.02em; }
.stat { border-radius: 20px; }
.stat b { font-weight: 600; font-size: 23px; letter-spacing: -.02em; }
.bodies { border-radius: 26px; }

/* avatar */
.avatar { width: 46px; height: 46px; border-radius: 23px; background: var(--lav); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 17px; flex: 0 0 auto; }

/* floating pill navigation */
#tabs { left: 14px; right: 14px; bottom: calc(12px + var(--safe-bottom)); height: 64px; padding: 0 8px; border-radius: 32px;
  background: rgba(30,30,34,.92); border: 1px solid #2E2E34; box-shadow: 0 14px 34px rgba(0,0,0,.5);
  display: flex; justify-content: space-between; align-items: center; }
.tab { height: 48px; min-width: 48px; padding: 0 12px; border-radius: 24px; flex-direction: row; gap: 8px; color: #C9C9CE; font-size: 0; }
.tab svg { width: 22px; height: 22px; }
.tab span { display: none; }
.tab[aria-current="page"] { background: var(--lav); color: var(--ink); padding: 0 16px 0 13px; }
.tab[aria-current="page"] span { display: inline; font-size: 14px; font-weight: 700; }

/* buttons, pills */
.btn { border-radius: 26px; font-weight: 700; }
.btn.small { border-radius: 20px; }
.btn.primary { background: var(--green); color: var(--ink); }
.seg2 { display: flex; flex-wrap: wrap; gap: 8px; background: none; padding: 0; }
.seg2 button { height: 40px; padding: 0 18px; border-radius: 20px; border: 1.5px solid #3A3A41; color: var(--text); background: none; }
.seg2 button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--ink); }
.range button { border: 1.5px solid #3A3A41; background: none; color: var(--text); }
.range button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--ink); }
.chip { border-radius: 22px; }

/* today card */
.hero { background: var(--green); color: var(--ink); border-left: 0; border-radius: 28px; padding: 20px; }
.hero.quiet { background: var(--lav); }
.hero-k { color: rgba(20,20,20,.62); font-weight: 600; font-size: 14px; }
.hero-t { font-weight: 600; font-size: 30px; letter-spacing: -.03em; line-height: 1.08; margin: 6px 0 8px; }
.hero-s { color: rgba(20,20,20,.68); }
.hero .chip { background: var(--ink); color: #fff; }
.hero .btn.primary { background: var(--ink); color: #fff; }

/* readiness + nudge */
.rcard { background: var(--pink); color: var(--ink); border-radius: 24px; }
.rcard-n { background: #fff; color: var(--ink); font-size: 20px; border-color: var(--ink); }
.rcard-n.ok { border-color: #7C6AE0; } .rcard-n.down { border-color: #E2534F; } .rcard-n.up { border-color: #6CA020; }
.rcard-t, .rcard-s { color: rgba(20,20,20,.68); } .rcard-t b { color: var(--ink); }
.nudge { background: var(--surface); border-radius: 20px; }

/* week strip */
.wk { background: none; border: 0; border-radius: 20px; padding: 6px 0 8px; gap: 5px; }
.wk-d { font-size: 12px; }
.wk-n { width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; font-size: 15px; font-weight: 600; background: var(--surface); }
.wk.done { background: none; }
.wk.done .wk-n { background: var(--lav); color: var(--ink); }
.wk.done .wk-w { color: var(--lav); }
.wk.planned .wk-n { box-shadow: inset 0 0 0 1.5px var(--lav); }
.wk.today { border: 0; }
.wk.today .wk-n { background: var(--green); color: var(--ink); box-shadow: none; }

/* workout cards */
.wcard { border-radius: 28px; padding: 20px 16px 20px 20px; color: var(--ink); margin-bottom: 12px; }
.wcard.c0 { background: var(--lav); } .wcard.c1 { background: var(--green); } .wcard.c2 { background: var(--pink); }
.wcard:active { filter: brightness(.95); }
.wcard-t { font-weight: 600; font-size: 24px; letter-spacing: -.03em; }
.wcard-s { color: rgba(20,20,20,.68); }
.wcard .chev { width: 40px; height: 40px; padding: 9px; border-radius: 20px; background: rgba(255,255,255,.6); color: var(--ink); }
.erow { border-radius: 20px; }
.add-row-btn { border-radius: 20px; }
.start-bar .btn { border-radius: 28px; }

/* history */
.hist li { border-radius: 22px; }
.hist-t, .hist-n { font-weight: 600; font-size: 19px; letter-spacing: -.02em; }

/* live workout */
.wo-title h2 { font-weight: 600; font-size: 22px; letter-spacing: -.02em; }
.ex-name { font-weight: 600; font-size: 18px; letter-spacing: -.02em; }
.ex.open { border-radius: 24px; margin: 8px 10px; border-bottom: 0; }
.ex-count.has { background: var(--green); color: var(--ink); }
.ex-count { font-size: 16px; }
.set-v { font-weight: 600; font-size: 18px; }
.step-row { border-radius: 20px; }
.step-row input { font-weight: 600; font-size: 23px; }
.note { border-radius: 18px; }
.log { background: var(--lav); color: var(--ink); border-radius: 29px; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }

/* white rest-timer panel */
#timer { left: 12px; right: 12px; bottom: calc(var(--tabs-h) + var(--safe-bottom) + 6px); border-radius: 26px; overflow: hidden;
  background: #F4F4F1; color: var(--ink); box-shadow: 0 12px 30px rgba(0,0,0,.45); padding: 0 16px 12px; }
body.in-workout #timer { bottom: calc(12px + var(--safe-bottom)); padding-bottom: 12px; }
#timer-track { background: #E1E1DB; } #timer-bar { background: var(--lav); }
.timer-lbl { color: rgba(20,20,20,.55); }
#timer-time { color: var(--ink); font-weight: 600; font-size: 32px; letter-spacing: -.03em; }
.timer-btns button { background: #E4E4DE; color: var(--ink); border-radius: 22px; }
#timer.done { background: var(--green); }
body.timer-on:not(.in-workout) .start-bar { bottom: calc(var(--tabs-h) + var(--safe-bottom) + 84px); }

/* sheets + dialogs */
.sheet-card { border-radius: 28px 28px 0 0; }
.sheet-card h3 { font-weight: 600; font-size: 23px; letter-spacing: -.02em; }
.opt { border-radius: 20px; }
.opt[aria-pressed="true"] { background: var(--green); color: var(--ink); box-shadow: none; }
.opt[aria-pressed="true"] .sec-sub { color: rgba(20,20,20,.6); }
.dlg { border-radius: 26px; } .dlg h3 { font-weight: 600; font-size: 21px; letter-spacing: -.02em; }
.text-in { border-radius: 16px; }
.group { border-radius: 22px; }
.mchip[aria-pressed="true"] { background: var(--green); color: var(--ink); }

/* recovery + insights accents */
.ring-v { font-weight: 600; font-size: 28px; }
.ring.ok .ring-fg { stroke: var(--lav); }
.chart .ln.alt { stroke: var(--lav); } .chart .ln.alt-dot { fill: var(--lav); }
.chart .bar.soft { fill: var(--lav); }
.chip-s.flat { background: rgba(199,181,250,.16); color: var(--lav); }
.spark.flat path { stroke: var(--lav); }
.pp-bar { background: var(--lav); }
.bw-top b { font-weight: 600; font-size: 26px; letter-spacing: -.02em; }
.vol-bar i.over { background: var(--pink); }
.demo-banner { border-radius: 18px; background: rgba(199,181,250,.14); color: var(--lav); }
.demo-banner button { color: var(--lav); }
#onboard .text-in { background: var(--surface); }
.link-inline { color: var(--green); }

/* ================= Appearance: accent palettes + light/dark ================= */
:root {
  --accent-text: var(--green); --accent-line: var(--green);
  --nav-bg: rgba(30,30,34,.92); --nav-border: #2E2E34; --nav-icon: #C9C9CE; --pill-border: #3A3A41;
  --panel: #F4F4F1; --panel-ink: #141414; --panel-btn: #E4E4DE; --panel-track: #E1E1DB; --ph: #5D646C;
}
:root { --c4: #FFD3A8; }
:root[data-accent="sea"]  { --c4: #CEDFCC; }
:root[data-accent="dusk"] { --c4: #FFE0B8; }
:root[data-accent="sand"] { --c4: #F9E3CC; }
:root[data-accent="sea"]  { --green: #67B39F; --green-lo: #CEDFCC; --green-soft: rgba(103,179,159,.16); --lav: #A9D3C4; --pink: #E1EDDD; }
:root[data-accent="dusk"] { --green: #A9B8FF; --green-lo: #DDE3FF; --green-soft: rgba(169,184,255,.16); --lav: #CDBEF3; --pink: #F3CAD6; }
:root[data-accent="sand"] { --green: #F4BE8C; --green-lo: #F9E3CC; --green-soft: rgba(244,190,140,.16); --lav: #E7D3BC; --pink: #CBDCC4; }

:root[data-mode="light"] {
  --bg: #F3F4F1; --surface: #FFFFFF; --raised: #ECEDE9; --line: #E3E4DF; --text: #141414; --muted: #6E7073;
  --muscle: #D9DBD6; --skin: #E7E8E4; --base: #E7E8E4;
  --nav-bg: rgba(255,255,255,.95); --nav-border: #E3E4DF; --nav-icon: #55575B; --pill-border: #D3D4CF;
  --panel: #1B1B1F; --panel-ink: #F4F4F1; --panel-btn: #2C2C31; --panel-track: #34343A; --ph: #A3A5A8;
  --accent-text: #5E7A00; --accent-line: #7FA30C;
}
:root[data-mode="light"][data-accent="sea"]  { --accent-text: #2D6876; --accent-line: #2D6876; }
:root[data-mode="light"][data-accent="dusk"] { --accent-text: #4654B8; --accent-line: #5B69D0; }
:root[data-mode="light"][data-accent="sand"] { --accent-text: #9A5622; --accent-line: #C27434; }

/* colors that now follow the theme */
#tabs { background: var(--nav-bg); border-color: var(--nav-border); }
.tab { color: var(--nav-icon); }
.seg2 button, .range button { border-color: var(--pill-border); }
.seg2 button[aria-pressed="true"], .range button[aria-pressed="true"] { border-color: var(--green); }
#timer { background: var(--panel); color: var(--panel-ink); }
#timer-track { background: var(--panel-track); }
.timer-lbl { color: var(--panel-ink); opacity: .6; }
#timer-time { color: var(--panel-ink); }
.timer-btns button { background: var(--panel-btn); color: var(--panel-ink); }
#timer.done, #timer.done #timer-time, #timer.done .timer-btns button { color: var(--ink); }
#toast { background: var(--text); color: var(--bg); }
.step-row input::placeholder, .note::placeholder { color: var(--ph); }
.link-inline { color: var(--accent-text); }
.mgrid li.hit b { color: var(--accent-text); }
.chip-s.up { color: var(--accent-text); }
.chart .ln { stroke: var(--accent-line); } .chart .ln-dot { fill: var(--accent-line); }
.spark.up path { stroke: var(--accent-line); }
:root[data-mode="light"] .wk.done .wk-w,
:root[data-mode="light"] .chip-s.flat,
:root[data-mode="light"] .demo-banner, :root[data-mode="light"] .demo-banner button { color: var(--text); }
:root[data-mode="light"] .warn { color: #A26B00; }
:root[data-mode="light"] .spark.flat path { stroke: #8A8D92; }
:root[data-mode="light"] .chart .ln.alt { stroke: var(--accent-line); } :root[data-mode="light"] .chart .ln.alt-dot { fill: var(--accent-line); }
:root[data-mode="light"] #tabs { box-shadow: 0 10px 28px rgba(0,0,0,.12); }
:root[data-mode="light"] .card, :root[data-mode="light"] .stat, :root[data-mode="light"] .group,
:root[data-mode="light"] .erow, :root[data-mode="light"] .hist li, :root[data-mode="light"] .bodies,
:root[data-mode="light"] .lift-card { box-shadow: 0 1px 2px rgba(0,0,0,.04); }

/* goals + PRs */
.goal-pill { height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid var(--pill-border); font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.goal-pill.on { border-color: transparent; background: var(--surface); color: var(--text); padding-left: 4px; }
.wring { width: 26px; height: 26px; }
.wring-bg { fill: none; stroke: var(--raised); stroke-width: 5; }
.wring-fg { fill: none; stroke: var(--green); stroke-width: 5; stroke-linecap: round; }
.goal-line { margin-top: 10px; font-size: 14px; } .goal-line b { color: var(--accent-text); }
.goal-week { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center; }
.gw-ring { position: relative; width: 74px; height: 74px; } .gw-ring .wring { width: 74px; height: 74px; }
.gw-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 18px; }
.goal-week .goal-line { margin-top: 2px; }
.goals { padding-top: 6px; padding-bottom: 6px; }
.goal-inline { background: var(--raised); margin-top: 14px; display: grid; gap: 8px; }
.goal-row { display: grid; gap: 7px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.goal-row:last-child { border-bottom: 0; }
.goal-top { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; } .goal-top span { color: var(--muted); font-weight: 600; white-space: nowrap; }
.goal-bar { height: 10px; border-radius: 5px; background: var(--raised); overflow: hidden; } .goal-bar i { display: block; height: 100%; border-radius: 5px; background: var(--lav); } .goal-bar i.done { background: var(--green); }

function bodySVG(side, sets) {
  // sets: Map muscle -> sets this week. 1-5 = light green, 6+ = bright green.
  const lvl = (m) => { const n = sets.get(m) || 0; return n >= 6 ? " hit" : n > 0 ? " hit-lo" : ""; };
  const draw = () => BODY[side].map((p) => {
    if (p.m === "base") return `<path class="base" d="${p.d}"/>`;
    return p.m ? `<path class="mus${lvl(p.m)}" data-m="${p.m}" d="${p.d}"/>` : `<path class="skin" d="${p.d}"/>`;
  }).join("");
  const mid = side === "front" ? `<path class="line" d="M100,119 L100,216"/>` : `<path class="line" d="M100,50 L100,230"/>`;
  return `<svg viewBox="2 6 196 404" class="body" role="img" aria-label="${side === "front" ? "Front" : "Back"} of body">
    <g>${draw()}</g><g transform="translate(200,0) scale(-1,1)">${draw()}</g>
    <path class="detail" d="${BODY_DETAIL[side]}"/><path class="detail" transform="translate(200,0) scale(-1,1)" d="${BODY_DETAIL[side]}"/>
    ${mid}<path class="skin" d="${BODY_HEAD}"/></svg>`;
}

function liftSeries(sessions) {
  const m = {};
  [...sessions].sort((a, b) => a.date.localeCompare(b.date)).forEach((s) => s.entries.forEach((e) => {
    const est = (x) => estOn(x, s.date);
    const sets = e.sets.filter((x) => x.tag !== "warmup");
    const vals = sets.map(est).filter((v) => v != null);
    if (!vals.length) return;
    const best = sets.reduce((b, x) => (est(x) || 0) > (est(b) || 0) ? x : b, sets[0]);
    (m[e.exercise] = m[e.exercise] || []).push({ date: s.date, v: Math.max(...vals), top: best });
  }));

function liftStatus(series) {
  if (series.length < 4) return { cls: "wait", label: `Collecting data (${series.length}/4)`, pct: null };
  const cutoff = addDays(today(), -42);
  let pts = series.filter((p) => p.date >= cutoff);
  if (pts.length < 4) pts = series.slice(-6);
  const t0 = parseDay(pts[0].date);
  const xs = pts.map((p) => (parseDay(p.date) - t0) / 86400000), ys = pts.map((p) => p.v);
  const mx = avg(xs), my = avg(ys);
  const den = xs.reduce((a, x) => a + (x - mx) ** 2, 0) || 1;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / den;
  const pctWeek = slope * 7 / my * 100;
  const span = xs[xs.length - 1] - xs[0];
  const pct = slope * span / (my - slope * (mx - xs[0])) * 100;
  const best = Math.max(...series.map((p) => p.v));
  const sincePR = series.length - 1 - series.map((p) => p.v).lastIndexOf(best);
  let cls, label;
  if (pctWeek >= 0.4) { cls = "up"; label = "Progressing"; }
  else if (pctWeek <= -0.6) { cls = "down"; label = "Declining"; }
  else if (sincePR >= 3) { cls = "flat"; label = "Plateau"; }
  else { cls = "up"; label = "Holding steady"; }
  return { cls, label, pct, pctWeek, best, sincePR, weeks: Math.max(1, Math.round(span / 7)) };
}

  const lv = readinessLevel(o.readiness);
  return `<button class="rcard" data-action="tab" data-tab="recovery">
    <span class="rcard-n ${lv.cls}">${o.readiness}</span>
    <span class="rcard-t"><b>Readiness · ${lv.word}</b><span>${lv.tip}</span><span class="rcard-s">Slept ${dash(o.total, fmtHM)} · HRV ${dash(o.hrv, (v) => v + " ms")}${state.demo ? " · sample data" : ""}</span></span></button>`;
}

function insightsHTML(embedded) {
  const S = src(), sessions = S.sessions, o = S.oura;
  const nights = Object.keys(o).length;
  const head = `<p class="sub" style="margin:-4px 0 14px">From ${pl(sessions.length, "workout")}${nights ? ` and ${pl(nights, "night")} of Oura data` : ""}</p>${demoBanner()}`;
  if (sessions.length < 3) return head + (state.demo ? "" : goalsSectionHTML(liftSeries(sessions))) + `<div class="card"><h4>Keep logging</h4>
    <p class="sub">Insights start appearing after a few workouts and get more reliable every week. Lift trends need 4 sessions of a lift; sleep and readiness comparisons need Oura connected.</p>
    ${state.demo ? "" : `<button class="btn primary block" data-action="demo-on" style="margin-top:12px">Preview with sample data</button>`}</div>`;

  // 1. Lift progress
  const bwNow = bodyweightOn(today());
  const series = liftSeries(sessions);
  const order = { down: 0, flat: 1, up: 2, wait: 3 };
  const lifts = Object.entries(series).map(([name, s]) => ({ name, s, st: liftStatus(s) }))
    .sort((a, b) => order[a.st.cls] - order[b.st.cls] || b.s.length - a.s.length);
  const counts = { up: 0, flat: 0, down: 0 };
  lifts.forEach((l) => { if (counts[l.st.cls] != null) counts[l.st.cls]++; });
  const liftsHTML = lifts.map((l) => `<button class="lift" data-action="lift" data-name="${esc(l.name)}">
      <span><b>${esc(l.name)}</b><span class="chip-s ${l.st.cls}">${l.st.label}</span>
      ${l.st.pct != null ? `<span class="lift-p">${signed(l.st.pct)}% est. 1RM over ${pl(l.st.weeks, "week")}</span>` : ""}
      ${bwNow && !state.demo ? `<span class="rel">Best: ${(Math.max(...l.s.map((p) => p.v)) / bwNow).toFixed(2)}× bodyweight</span>` : ""}</span>
      ${sparkSVG(l.s.map((p) => p.v), l.st.cls)}</button>`).join("");

  // 2. What affects your lifts
  const perfs = sessionPerf(sessions);
  const rd = effect(perfs, (d) => o[d] ? o[d].readiness : null, [
    { label: "Readiness < 70", test: (v) => v < 70 }, { label: "70–84", test: (v) => v >= 70 && v < 85 }, { label: "85+", test: (v) => v >= 85 }]);
  const sl = effect(perfs, (d) => o[d] && o[d].total != null ? o[d].total / 3600 : null, [
    { label: "Under 6.5h", test: (v) => v < 6.5 }, { label: "6.5–7.5h", test: (v) => v >= 6.5 && v < 7.5 }, { label: "7.5h+", test: (v) => v >= 7.5 }]);
  const wk = effect(perfs, (d) => { const p = o[addDays(d, -1)]; return p && p.steps != null ? p.steps : null; }, [
    { label: "After 15k+ steps", test: (v) => v >= 15000 }, { label: "After < 15k", test: (v) => v < 15000 }]);
  const need = nights ? "Needs at least 3 sessions in each group to compare." : "Connect Oura to unlock this.";
  const wkSentence = (() => { const a = wk[0], b = wk[1]; if (a.n < 3 || b.n < 3) return null; const d = b.avg - a.avg;
    return Math.abs(d) < 1 ? "Busy days on your feet don't seem to affect the next day's lifts so far."
      : d > 0 ? `After heavy days on your feet (15k+ steps, like a long warehouse shift), your lifts run about ${d.toFixed(1)}% lower the next day.`
              : `Interestingly, you've lifted ${Math.abs(d).toFixed(1)}% better after your busiest days.`; })();

  // 3. Training load vs HRV (last 8 weeks)
  const mon = mondayOf(today()), weeks = [...Array(8)].map((_, i) => addDays(mon, (i - 7) * 7));
  const wSets = weeks.map((w) => sessions.filter((s) => s.date >= w && s.date <= addDays(w, 6)).reduce((n, s) => n + workSetCount(s), 0));
  const wHrv = weeks.map((w) => avg([...Array(7)].map((_, i) => o[addDays(w, i)]).filter(Boolean).map((x) => x.hrv).filter((v) => v != null)));
  const hrvBase = avg(Object.keys(o).sort().slice(-30).map((k) => o[k].hrv).filter((v) => v != null));
  const lastFull = 6; // last complete week
  let loadMsg = nights ? "Your training volume and recovery look balanced." : "Connect Oura to compare training volume with recovery.";
  if (nights && wHrv[lastFull] != null && hrvBase) {
    const prevSets = avg(wSets.slice(2, lastFull).filter((x) => x > 0)) || 0;
    if (wHrv[lastFull] < hrvBase * 0.92 && wSets[lastFull] >= prevSets) loadMsg = `<b class="warn">Possible fatigue building:</b> last week's HRV averaged ${Math.round(wHrv[lastFull])} ms, below your ${Math.round(hrvBase)} ms baseline, while volume stayed high. A lighter week could help.`;
    else if (wHrv[lastFull] > hrvBase * 1.05) loadMsg = "HRV is above your baseline: you're recovering well from your current volume.";
  }

  // 4. Weekly sets per muscle (4-week average)
  const from = addDays(today(), -27), msets = {};
  sessions.filter((s) => s.date >= from).forEach((s) => s.entries.forEach((e) => e.muscles.forEach((m, i) => msets[m] = (msets[m] || 0) + workCount(e) * (i === 0 ? 1 : 0.5) / 4)));
  const mrows = Object.keys(MUSCLES).map((k) => ({ k, v: msets[k] || 0 })).sort((a, b) => b.v - a.v);
  const volHTML = mrows.map((r) => `<div class="vol-row"><span>${MUSCLES[r.k]}</span>
      <div class="vol-bar"><em></em><i class="${r.v >= 10 && r.v <= 20 ? "in" : r.v > 20 ? "over" : r.v > 0 ? "under" : ""}" style="width:${Math.min(100, r.v / 25 * 100)}%"></i></div>
      <b>${r.v ? r.v.toFixed(r.v < 10 ? 1 : 0) : "–"}</b></div>`).join("");

  // 5. Push / pull balance
  const push = ["chest", "frontDelts", "triceps"].reduce((n, k) => n + (msets[k] || 0), 0);
  const pull = ["lats", "upperBack", "rearDelts", "biceps"].reduce((n, k) => n + (msets[k] || 0), 0);
  const ratio = pull ? push / pull : null;
  const ppMsg = ratio == null ? "Log some pull work to compare." : ratio > 1.25 ? `You're doing ${ratio.toFixed(1)}× more pushing than pulling. Many lifters aim for roughly even to protect the shoulders.`
    : ratio < 0.8 ? "You're doing noticeably more pulling than pushing." : "Pushing and pulling are well balanced.";

  return head + `${state.demo ? "" : goalsSectionHTML(series)}
    <div class="sec-h"><h3>Lift progress</h3><span class="sec-sub">${counts.up} up · ${counts.flat} flat · ${counts.down} down</span></div>
    <div class="card lifts">${liftsHTML || `<p class="sub">Log weighted sets to see trends.</p>`}</div>
    ${prBoardHTML(sessions)}
    <div class="sec-h" style="margin-top:22px"><h3>What affects your lifts</h3></div>
    <p class="sub" style="margin:-6px 0 10px">Each bar shows how strong your sessions were compared with your recent average for those lifts.</p>
    ${effectCard("Readiness", rd, compareSentence(rd, "on 85+ readiness days", "on days under 70"), need)}
    ${effectCard("Sleep the night before", sl, compareSentence(sl, "after 7.5+ hours of sleep", "after less than 6.5"), need)}
    ${effectCard("Work the day before", wk, wkSentence, need)}
    <div class="sec-h" style="margin-top:22px"><h3>Training load vs recovery</h3></div>
    <div class="card"><p class="sub">${loadMsg}</p>
      <div class="mini-l">Sets per week</div>${chartSVG({ labels: weeks, series: [{ type: "bar", data: wSets }], h: 100, yMin: 0 })}
      ${nights ? `<div class="mini-l">Average HRV (ms)</div>${chartSVG({ labels: weeks, series: [{ data: wHrv, cls: "ln" }], h: 100, guide: hrvBase })}` : ""}</div>
    <div class="sec-h" style="margin-top:22px"><h3>Weekly sets per muscle</h3><span class="sec-sub">4-week average</span></div>
    <div class="card"><p class="sub">The shaded zone is 10–20 sets a week, a range commonly recommended for muscle growth. Muscles an exercise works secondarily count as half a set.</p><div class="vol">${volHTML}</div></div>
    <div class="card"><h4>Push / pull balance</h4><p class="sub">${ppMsg}</p>
      <div class="pp"><div class="pp-bar"><i style="width:${push + pull ? push / (push + pull) * 100 : 50}%"></i></div>
      <div class="pp-l"><span>Push ${push.toFixed(0)} sets/wk</span><span>Pull ${pull.toFixed(0)} sets/wk</span></div></div></div>
    <p class="hint">These patterns show what tends to go together in your data, not proof of what causes what. They get more reliable the more you log.</p>`;
}

    ${repRecordsHTML(name)}

async function cloudPush() {
  if (!sb || !session) return;
  const blob = { cardio: state.cardio ? { ...state.cardio, live: null } : null, food: state.food, goals: state.goals, theme: state.theme, profile: state.profile, workouts: state.workouts, sessions: state.sessions, plan: state.plan, restSeconds: state.restSeconds,

  } catch (e) { /* offline: the next save or app open retries */ }

/* Combines the cloud copy with this phone's copy so nothing logged on either side is lost. */
function mergeRemote(r) {
  const deleted = new Set([...(state.deleted || []), ...(r.deleted || [])]);
  const byId = new Map();
  // This phone's copy goes first so it wins ties (e.g. right after converting units).
  [...state.sessions, ...(r.sessions || [])].forEach((s) => {
    if (!s || deleted.has(s.id)) return;
    const cur = byId.get(s.id);
    const better = (a, b) => (a.mod || 0) !== (b.mod || 0) ? (a.mod || 0) > (b.mod || 0)
      : setCount(a) > setCount(b) || (a.finishedAt && !b.finishedAt && setCount(a) >= setCount(b));
    if (!cur || better(s, cur)) byId.set(s.id, s);
  });
  state.sessions = [...byId.values()];
  if (r.goals && (!state.goals || (r.goals.updatedAt || 0) > (state.goals.updatedAt || 0))) state.goals = r.goals;
  if (r.food) mergeFood(r.food);
  if (r.cardio) mergeCardio(r.cardio);
  if (r.profile) {
    const lp = state.profile;
    const wDel = new Set([...((lp && lp.wDel) || []), ...(r.profile.wDel || [])]);
    const byDate = new Map();
    const newerLocal = lp && (lp.updatedAt || 0) >= (r.profile.updatedAt || 0);
    const order = newerLocal ? [r.profile.weighIns || [], lp.weighIns || []] : [(lp && lp.weighIns) || [], r.profile.weighIns || []];
    order.forEach((list) => list.forEach((x) => { if (!wDel.has(x.date)) byDate.set(x.date, x); }));
    state.profile = { ...(newerLocal ? lp : r.profile), weighIns: [...byDate.values()], wDel: [...wDel] };
  }
  if ((r.updatedAt || 0) > (state.updatedAt || 0)) {
    if (Array.isArray(r.workouts) && r.workouts.length) state.workouts = r.workouts;
    if (r.plan) state.plan = r.plan;
    if (r.restSeconds) state.restSeconds = r.restSeconds;
    if (r.theme) { state.theme = r.theme; applyTheme(); }
  }
  state.deleted = [...deleted];
}
async function cloudPull() {
  if (!sb || !session) return;
  try {
    const { data, error } = await sb.from("user_data").select("data").eq("user_id", session.user.id).maybeSingle();
    if (error) return;
    if (data && data.data) mergeRemote(data.data);
    save();
    render();
  } catch (e) { /* offline */ }
}

async function ouraRefresh(force) {
  if (!sb || !session || ouraBusy) return;
  ouraBusy = true;
  try {
    const { data: c } = await sb.from("oura_connections").select("*").eq("user_id", session.user.id).maybeSingle();
    state.oura.connected = !!c;
    state.oura.lastError = c ? c.last_error : null;
    if (c) {
      const stale = !c.last_sync || Date.now() - new Date(c.last_sync).getTime() > 3 * 3600_000;
      if (force || stale) {
        ui.ouraSyncing = true; render();
        const { error } = await sb.functions.invoke("oura-sync", { body: { days: c.last_sync ? 14 : 120 } });
        ui.ouraSyncing = false;
        if (error) toast("Couldn't sync Oura right now. Try Sync now in Settings.");
      }
      const { data: rows } = await sb.from("oura_days").select("day, data").eq("user_id", session.user.id).gte("day", addDays(today(), -150));
      if (rows) {
        const days = {};
        rows.forEach((r) => { days[r.day] = r.data; });
        state.oura.days = days;
        state.oura.lastSync = Date.now();
      }
    }
    save();
  } catch (e) { ui.ouraSyncing = false; }
  ouraBusy = false;
  render();
}

/* Keeps two accounts on one phone from mixing: a different account starts from its own cloud copy. */
function claimLocalFor(uid) {
  if (state.ownerId && state.ownerId !== uid) {
    const fresh = migrate({ sessions: [] });
    fresh.ownerId = uid;
    state = fresh;
    applyTheme();
    ui.drafts = {}; ui.open = null; ui.detail = null; ui.workoutOpen = false;
  }
  state.ownerId = uid;
}
async function initCloud() {
  if (!sb) { await loadPhotos(); render(); return; }
  try {
    const { data } = await sb.auth.getSession();
    session = data.session;
    sb.auth.onAuthStateChange((_event, s) => { session = s; });
    if (session) { claimLocalFor(session.user.id); await cloudPull(); checkProfileGate(); await loadPhotos(); syncPhotos(); await ouraRefresh(false); }
    else { await loadPhotos(); render(); }
  } catch (e) { /* offline */ }
}

async function signIn(mode) {
  if (!sb) { toast("Can't reach the server. Check your connection."); return; }
  const email = ($("#authEmail") || {}).value?.trim();
  const password = ($("#authPw") || {}).value || "";
  if (!email || !email.includes("@")) { toast("Enter your email address."); return; }
  if (password.length < 6) { toast("Passwords need at least 6 characters."); return; }
  const btn = $('[data-action="auth-go"]');
  if (btn) { btn.disabled = true; btn.textContent = "One moment…"; }
  const res = mode === "signup" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (res.error) {

const weighIns = () => [...((state.profile && state.profile.weighIns) || [])].sort((a, b) => a.date.localeCompare(b.date));

function bodyweightOn(date) {

/* Typical overnight HRV (RMSSD, ms) by age and sex: 10th / 50th / 90th percentile.
   From published wearable age charts; a rough guide, not a medical standard. */
const HRV_NORMS = [
  { max: 24, male: [27, 46, 85], female: [26, 48, 82] },
  { max: 34, male: [24, 41, 77], female: [23, 43, 73] },
  { max: 44, male: [21, 34, 66], female: [20, 36, 60] },
  { max: 54, male: [19, 28, 58], female: [18, 30, 52] },
  { max: 64, male: [17, 24, 50], female: [16, 25, 46] },
  { max: 74, male: [15, 22, 44], female: [14, 23, 40] },
  { max: 200, male: [13, 20, 39], female: [12, 20, 36] },
];
function hrvNorm() {
  const p = state.profile, age = p && ageOn(p.dob);
  if (age == null || !p.sex) return null;
  const row = HRV_NORMS.find((r) => age <= r.max);
  return { age, sex: p.sex, p: row[p.sex] };
}
function hrvAgeCardHTML(avg30) {
  const n = hrvNorm();
  if (!n || avg30 == null) return "";
  const [p10, p50, p90] = n.p, lo = Math.min(p10 * 0.7, avg30 * 0.9), hi = Math.max(p90 * 1.15, avg30 * 1.1);
  const X = (v) => ((v - lo) / (hi - lo) * 100).toFixed(1);
  const where = avg30 >= p90 ? "in the top 10% for" : avg30 >= p50 ? "above the middle for" : avg30 >= p10 ? "below the middle for" : "in the bottom 10% for";
  return `<div class="card"><h4>HRV for your age</h4>
    <p class="sub">Your 30-day average of ${Math.round(avg30)} ms is ${where} ${n.sex === "male" ? "men" : "women"} aged ${n.age}. Your own trend matters more than this comparison.</p>
    <div class="norm"><div class="norm-band" style="left:${X(p10)}%;width:${X(p90) - X(p10)}%"></div>
      <div class="norm-mid" style="left:${X(p50)}%"></div><div class="norm-you" style="left:${X(avg30)}%"></div></div>
    <div class="norm-l"><span style="left:${X(p10)}%">${p10}</span><span style="left:${X(p50)}%">${p50} typical</span><span style="left:${X(p90)}%">${p90}</span></div>
    <p class="sub small">Shaded: the middle 80% for your age and sex (rough reference ranges). White dot: you.</p></div>`;
}

function convertLoggedWeights(fromUnits, toUnits) {

function sessionsInWeek(mon) {
  const end = addDays(mon, 6);
  return state.sessions.filter((s) => s.finishedAt && s.date >= mon && s.date <= end && setCount(s) > 0).length;

function weekGoalStatus() {
  const g = goals().sessionsPerWeek;
  if (!g) return null;
  const mon = mondayOf(today()), done = sessionsInWeek(mon);
  let streak = 0;
  for (let w = 1; w < 104; w++) { if (sessionsInWeek(addDays(mon, -7 * w)) >= g) streak++; else break; }
  if (done >= g) streak++;
  return { goal: g, done, streak };
}
function weekRingSVG(done, goal) {
  const C = 2 * Math.PI * 15, f = Math.min(1, done / goal);

}

/* ---------- Lift goals (stored as estimated 1RM in kg, shown in the person's units) ---------- */
function liftGoalRows(series) {
  return Object.entries(goals().lifts).map(([name, g]) => {
    const s = series[name] || [];
    const target = kgToDisp(g.kg);
    const recent = s.slice(-3).map((p) => p.v);
    const current = recent.length ? Math.max(...recent) : null;
    const best = s.length ? Math.max(...s.map((p) => p.v)) : null;
    const st = liftStatus(s);
    let eta = null;
    if (current && current < target && st.pctWeek > 0.2) {
      const weeks = (target / current - 1) / (st.pctWeek / 100);
      if (weeks < 104) eta = addDays(today(), Math.round(weeks * 7));
    }
    return { name, target, current, best, done: best != null && best >= target, eta };
  });
}

/* ---------- Bulk-aware bodyweight rate ---------- */
const DIR_RANGES = {
  gain: { lo: 0.25, hi: 0.5, label: "lean bulk" },
  lose: { lo: -1.0, hi: -0.5, label: "steady cut" },
  maintain: { lo: -0.25, hi: 0.25, label: "maintenance" },
};
function weightRate() {
  const w = weighIns().filter((x) => x.date >= addDays(today(), -28));
  if (w.length < 3) return null;
  const t0 = parseDay(w[0].date), xs = w.map((x) => (parseDay(x.date) - t0) / 86400000), ys = w.map((x) => x.kg);
  if (xs[xs.length - 1] < 10) return null;
  const mx = avg(xs), my = avg(ys);
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / (xs.reduce((a, x) => a + (x - mx) ** 2, 0) || 1);
  const perWeekKg = slope * 7;
  return { perWeek: kgToDisp(perWeekKg), pct: perWeekKg / ys[ys.length - 1] * 100 };
}
function weightRateHTML() {
  const dir = goals().weightDir, r = weightRate();
  const pick = `<div class="seg2 dir-seg">${[["gain", "Gaining"], ["maintain", "Maintaining"], ["lose", "Losing"]].map(([k, l]) =>
    `<button data-action="goal-dir" data-d="${k}" aria-pressed="${dir === k}">${l}</button>`).join("")}</div>`;
  if (!r) return `<p class="sub small">${dir ? "Log a few weigh-ins over 10+ days to see your weekly rate." : "Are you gaining, maintaining or losing right now?"}</p>${pick}`;
  const range = dir && DIR_RANGES[dir];
  let msg = "";
  if (range) {
    msg = r.pct < range.lo ? (dir === "gain" ? `Slower than a typical ${range.label} (0.25–0.5% of bodyweight a week). A small calorie bump usually speeds it up.` : dir === "lose" ? "Faster than a typical steady cut (0.5–1% a week). Losing quickly can cost strength." : "Trending down a bit.")
        : r.pct > range.hi ? (dir === "gain" ? `Faster than a typical ${range.label}. Some of that is likely fat; easing calories slightly can slow it.` : dir === "lose" ? "Slower than a typical steady cut (0.5–1% a week)." : "Trending up a bit.")
        : `Right in a typical ${range.label} range.`;
  }
  return `<p class="rate"><b>${signed(r.perWeek, 1)} ${wUnit()}/week</b> <span>(${signed(r.pct, 2)}% of bodyweight)</span></p>
    ${msg ? `<p class="sub small" style="margin-top:4px">${msg}</p>` : ""}${pick}`;
}

const isWork = (x) => x.tag !== "warmup";

const roundTo = (v, inc) => Math.round(v / inc) * inc;
function modeHigh(nums) {
  const c = {}; nums.forEach((n) => c[n] = (c[n] || 0) + 1);
  return Number(Object.keys(c).sort((a, b) => c[b] - c[a] || b - a)[0]);
}

/* "Same reps, add weight each time":
   hit the target reps on every working set at the top weight -> add weight; missed -> repeat; missed twice running -> step back ~10%. */
function suggestion(name, sessionId) {
  const hist = finished().filter((s) => s.id !== sessionId)
    .map((s) => s.entries.find((e) => e.exercise === name)).filter((e) => e && e.sets.some(isWork));
  if (!hist.length) return null;
  const work = (e) => e.sets.filter(isWork);
  const last = work(hist[0]);
  if (last.every((x) => x.w == null)) {
    const best = Math.max(...last.map((x) => x.r));
    return { w: null, r: best + 1, kind: "bw", why: `Your best set last time was ${pl(best, "rep")}. Go for ${best + 1}.` };
  }
  const top = (e) => { const ws = work(e).filter((x) => x.w != null); const m = Math.max(...ws.map((x) => x.w)); return { W: m, sets: ws.filter((x) => x.w === m) }; };
  const { W, sets } = top(hist[0]);
  const T = modeHigh(hist.slice(0, 3).flatMap((e) => (work(e).some((x) => x.w != null) ? top(e).sets.map((x) => x.r) : [])));
  const inc = weightInc(W);
  if (sets.every((x) => x.r >= T)) {
    const out = { w: W + inc, r: T, kind: "up", why: `You hit ${T} reps on every set at ${fmtNum(W)} last time.` };
    const o = state.oura && state.oura.days && state.oura.days[today()];
    if (!state.demo && o && o.readiness != null && o.readiness < 70) out.note = `Readiness is ${o.readiness} today, so repeating ${fmtNum(W)} is a fine call too.`;
    return out;
  }
  let misses = 0;
  for (const e of hist) {
    if (!work(e).some((x) => x.w != null)) break;
    const t = top(e);
    if (t.W !== W || t.sets.every((x) => x.r >= T)) break;
    misses++;
  }
  if (misses >= 2) return { w: Math.max(inc, roundTo(W * 0.9, inc)), r: T, kind: "down", why: `${T} reps at ${fmtNum(W)} was missed two sessions running. A small step back lets you build up again.` };
  return { w: W, r: T, kind: "same", why: `You didn't get ${T} reps on every set at ${fmtNum(W)} last time. Stay here until you do.` };
}

  if (!sg) return "";
  const label = { up: "Add weight", same: "Repeat", down: "Step back", bw: "Beat last time" }[sg.kind];
  return `<div class="sugg ${sg.kind}"><div class="sugg-top"><b>${label}: ${sg.w != null ? fmtNum(sg.w) + " " + wUnit() : "BW"} × ${sg.r}</b>

}

/* ---------- PRs (compared with every earlier working set of this lift) ---------- */
function prsFor(name, set, date) {
  if (!isWork(set)) return [];
  const prior = [];
  state.sessions.forEach((s) => s.entries.forEach((e) => {
    if (e.exercise === name) e.sets.forEach((x) => { if (x !== set && isWork(x)) prior.push({ x, date: s.date }); });
  }));
  if (!prior.length) return [];                       // first time doing a lift isn't a PR
  const out = [];
  if (set.w != null) {
    const pw = prior.filter((p) => p.x.w != null);
    if (pw.length && set.w > Math.max(...pw.map((p) => p.x.w))) out.push("heavy");
    const same = pw.filter((p) => p.x.w === set.w);
    if (same.length && set.r > Math.max(...same.map((p) => p.x.r))) out.push("reps");
  } else {
    const pb = prior.filter((p) => p.x.w == null);
    if (pb.length && set.r > Math.max(...pb.map((p) => p.x.r))) out.push("reps");
  }
  const v = estOn(set, date), pv = prior.map((p) => estOn(p.x, p.date)).filter((n) => n != null);
  if (v != null && pv.length && v > Math.max(...pv)) out.push("e1");
  return out;
}
function recomputePRs(name) {
  const sess = [...state.sessions].sort((a, b) => a.date.localeCompare(b.date) || String(a.startedAt).localeCompare(String(b.startedAt)));
  let any = false, maxW = null, maxBw = null, maxE = null; const repsAt = {};
  sess.forEach((s) => s.entries.forEach((e) => {
    if (e.exercise !== name) return;
    e.sets.forEach((x) => {
      if (!isWork(x)) { delete x.pr; return; }
      const out = [], v = estOn(x, s.date);
      if (any) {
        if (x.w != null) { if (maxW != null && x.w > maxW) out.push("heavy"); const k = String(x.w); if (repsAt[k] != null && x.r > repsAt[k]) out.push("reps"); }
        else if (maxBw != null && x.r > maxBw) out.push("reps");
        if (v != null && maxE != null && v > maxE) out.push("e1");
      }
      if (out.length) x.pr = out; else delete x.pr;
      any = true;
      if (x.w != null) { maxW = maxW == null ? x.w : Math.max(maxW, x.w); const k = String(x.w); repsAt[k] = Math.max(repsAt[k] || 0, x.r); }
      else maxBw = maxBw == null ? x.r : Math.max(maxBw, x.r);
      if (v != null) maxE = maxE == null ? v : Math.max(maxE, v);
    });
  }));
}

/* ================= Progress photos ================= */
const POSES = ["Front", "Side", "Back", "Other"];

/* ---- local storage (IndexedDB holds the images; localStorage is far too small) ---- */
function idb() {
  if (idb.p) return idb.p;
  idb.p = new Promise((res, rej) => {
    const r = indexedDB.open("insight-photos", 1);
    r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result);

}

  return new Promise((res, rej) => { const q = db.transaction("photos").objectStore("photos").getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbPut(p) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("photos", "readwrite"); t.objectStore("photos").put(p); t.oncomplete = res; t.onerror = () => rej(t.error); }); }

function photoURL(p, thumb) {

/* ---- compression: long side ≤ 1280px, JPEG ~0.82; plus a 240px thumbnail ---- */
function fileToBitmap(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Couldn't read that image")); };
    img.src = url;
  });
}
function drawTo(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const c = document.createElement("canvas");
  c.width = Math.round((img.naturalWidth || img.width) * s); c.height = Math.round((img.naturalHeight || img.height) * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", q));
}
async function addPhoto(file, date, pose) {
  const img = await fileToBitmap(file);

async function deletePhoto(id) {

  Object.keys(PH.urls).forEach((k) => { if (k.startsWith(id)) { URL.revokeObjectURL(PH.urls[k]); delete PH.urls[k]; } });

/* ---- cloud: private bucket "progress", one folder per account ---- */
async function uploadPhoto(p) {
  if (!sb || !session || p.synced) return;
  try {
    const path = `${session.user.id}/${p.id}.jpg`;
    const { error } = await sb.storage.from("progress").upload(path, p.blob, { contentType: "image/jpeg", upsert: true });
    if (error) return;
    const { error: e2 } = await sb.from("progress_photos").upsert({ id: p.id, user_id: session.user.id, day: p.date, pose: p.pose, path, taken_at: p.at });
    if (e2) return;
    p.synced = true; p.owner = session.user.id;
    await idbPut(p);
  } catch (e) { /* retry next time */ }
}
async function syncPhotos() {
  if (!sb || !session || !PH.ready) return;
  try {
    for (const p of myPhotos()) if (!p.synced) await uploadPhoto(p);
    const { data: rows } = await sb.from("progress_photos").select("id, day, pose, path, taken_at").eq("user_id", session.user.id);
    if (!rows) return;
    const have = new Set(PH.list.map((p) => p.id));
    const remoteIds = new Set(rows.map((r) => r.id));
    // photos deleted from another phone disappear here too
    for (const p of myPhotos()) if (p.synced && !remoteIds.has(p.id)) { await idbDel(p.id); PH.list = PH.list.filter((x) => x !== p); }
    for (const r of rows) {
      if (have.has(r.id)) continue;
      const { data: blob, error } = await sb.storage.from("progress").download(r.path);
      if (error || !blob) continue;
      const img = await fileToBitmap(blob);
      const thumb = await drawTo(img, 240, 0.7);
      const p = { id: r.id, owner: session.user.id, date: r.day, pose: r.pose || "Front", blob, thumb, at: r.taken_at, synced: true };
      await idbPut(p); PH.list.push(p);
    }
    if (ui.tab === "photos") render();
  } catch (e) { /* offline */ }
}

const MEALS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["dinner", "Dinner"], ["snacks", "Snacks"]];
function food() {
  if (!state.food) state.food = { days: {}, saved: [], targets: { auto: true }, deleted: [], updatedAt: 0 };
  const f = state.food;
  f.days = f.days || {}; f.saved = f.saved || []; f.targets = f.targets || { auto: true }; f.deleted = f.deleted || [];
  return f;
}
const fid = () => "f_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const r0 = (v) => Math.round(v || 0);
function entryTotals(e) { const s = e.servings || 1; return { kcal: e.base.kcal * s, p: e.base.p * s, c: e.base.c * s, f: e.base.f * s }; }
function dayEntries(d) { return food().days[d] || []; }
function dayTotals(d) {
  return dayEntries(d).reduce((t, e) => { const x = entryTotals(e); t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.f += x.f; return t; }, { kcal: 0, p: 0, c: 0, f: 0 });
}
function foodTouch() { food().updatedAt = Date.now(); save(); }

/* ---------- Targets: profile + Oura steps (7-day average), +250 lean bulk ---------- */
function autoTargets() {
  const p = state.profile;
  if (!profileComplete()) return null;
  const kg = weighIns().slice(-1)[0].kg, age = ageOn(p.dob);
  const bmr = 10 * kg + 6.25 * p.heightCm - 5 * age + (p.sex === "male" ? 5 : -161);
  const od = (state.oura && state.oura.days) || {};
  const recent = [1, 2, 3, 4, 5, 6, 7].map((i) => od[addDays(today(), -i)]).filter((d) => d && d.steps != null).map((d) => d.steps);
  const steps = recent.length >= 3 ? avg(recent) : null;
  const actKey = (p.activity && ACTIVITY[p.activity]) ? p.activity : "active";
  const usedSteps = steps != null ? steps : ACTIVITY[actKey].steps;
  const stepKcal = usedSteps * 0.0005 * kg;                       // about 0.04 kcal per step at 80 kg
  const sessions = state.sessions.filter((s) => s.finishedAt && s.date >= addDays(today(), -28) && setCount(s) > 0).length;
  const trainKcal = (sessions / 4) * 250 / 7;                         // average daily cost of lifting
  const tdee = bmr * 1.15 + stepKcal + trainKcal;
  const dir = goals().weightDir || "gain";
  const adj = dir === "gain" ? 250 : dir === "lose" ? -400 : 0;
  const kcal = Math.round((tdee + adj) / 10) * 10;
  const prot = Math.round(2.0 * kg), fat = Math.round(kcal * 0.25 / 9);
  const carbs = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return { kcal, p: prot, c: carbs, f: fat, basis: { bmr: Math.round(bmr), steps: steps != null ? Math.round(steps) : null, activity: actKey, activitySet: !!p.activity, tdee: Math.round(tdee), adj, sessions } };
}
function targets() {
  const t = food().targets, a = autoTargets();
  if (t.auto !== false) return a;
  return { kcal: t.kcal || (a && a.kcal) || 2500, p: t.p || (a && a.p) || 150, c: t.c || (a && a.c) || 300, f: t.f || (a && a.f) || 80, basis: null, manual: true };
}
