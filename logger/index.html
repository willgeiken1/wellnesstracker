<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insight">
<meta name="theme-color" content="#0F0F11">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/appearance.css">
<link rel="stylesheet" href="css/goals.css">
<link rel="stylesheet" href="css/session.css">
<link rel="stylesheet" href="css/progress.css">
<link rel="stylesheet" href="css/food.css">
<link rel="stylesheet" href="css/cardio.css">
<link rel="stylesheet" href="css/platform.css">
<link rel="stylesheet" href="css/polish.css">
<link rel="stylesheet" href="css/privacy.css">
<link rel="stylesheet" href="css/brief.css">
<link rel="stylesheet" href="css/weekly.css">
<script>
try {
  var raw = localStorage.getItem("liftlog-v1");
  var saved = raw ? JSON.parse(raw) : null;
  if (saved && saved.appLock && saved.appLock.enabled && sessionStorage.getItem("insight-unlocked") !== "1")
    document.documentElement.classList.add("lock-first");
} catch (e) {}
</script>
</head>
<body>
<div id="stage">
  <section class="pane active" data-pane="home" id="pane-home"></section>
  <section class="pane" data-pane="workouts" id="pane-workouts"></section>
  <section class="pane" data-pane="food" id="pane-food"></section>
  <section class="pane" data-pane="progress" id="pane-progress"></section>
  <section class="pane" data-pane="insights" id="pane-insights"></section>
</div>
<main id="view" hidden></main>

<nav id="tabs" aria-label="Sections"><span id="tab-bubble" aria-hidden="true"></span>
  <button class="tab" data-action="tab" data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button class="tab" data-action="tab" data-tab="workouts" aria-label="Workouts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg><span>Workouts</span></button>
  <button class="tab" data-action="tab" data-tab="food" aria-label="Food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg><span>Food</span></button>
  <button class="tab" data-action="tab" data-tab="progress" aria-label="Progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.5l1.8-3h5.4l1.8 3H20v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Progress</span></button>
  <button class="tab" data-action="tab" data-tab="insights" aria-label="Insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Insights</span></button>
</nav>

<section id="workout" hidden aria-label="Workout in progress"></section>
<section id="cardio-live" hidden aria-label="Cardio in progress"></section>

<div id="timer" hidden role="timer">
  <div id="timer-track"><div id="timer-bar"></div></div>
  <div class="timer-row">
    <div><span class="timer-lbl" id="timer-lbl">Rest</span><span id="timer-time">0:00</span></div>
    <div class="timer-btns">
      <button class="t-adj" data-action="t-adj" data-d="-15" aria-label="Subtract 15 seconds">−15</button>
      <button class="t-adj" data-action="t-adj" data-d="15" aria-label="Add 15 seconds">+15</button>
      <button data-action="t-skip" id="t-skip">Skip</button>
    </div>
  </div>
</div>

<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<div id="onboard" hidden></div>
<div id="lock" hidden></div>
<div id="dialog" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
