<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insight">
<meta name="theme-color" content="#0F0F11">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/appearance.css">
<link rel="stylesheet" href="css/goals.css">
<link rel="stylesheet" href="css/session.css">
<link rel="stylesheet" href="css/progress.css">
<link rel="stylesheet" href="css/food.css">
<link rel="stylesheet" href="css/cardio.css">
<link rel="stylesheet" href="css/platform.css">
<link rel="stylesheet" href="css/polish.css">
<link rel="stylesheet" href="css/privacy.css">
<link rel="stylesheet" href="css/brief.css">
<link rel="stylesheet" href="css/home-widgets.css">
<link rel="stylesheet" href="css/weekly.css">
<link rel="stylesheet" href="css/routines.css">
<script>
try {
  var raw = localStorage.getItem("liftlog-v1");
  var saved = raw ? JSON.parse(raw) : null;
  if (saved && saved.appLock && saved.appLock.enabled && sessionStorage.getItem("insight-unlocked") !== "1")
    document.documentElement.classList.add("lock-first");
  var light = !!(saved && saved.theme && saved.theme.mode === "light");
  document.documentElement.dataset.mode = light ? "light" : "dark";
  document.documentElement.dataset.bar = light ? "light" : "dark";
  if (light) {
    var barMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    var themeMeta = document.querySelector('meta[name="theme-color"]');
    if (barMeta) barMeta.setAttribute("content", "default");
    if (themeMeta) themeMeta.setAttribute("content", "#F3F4F1");
  }
} catch (e) {}
</script>
</head>
<body>
<div id="stage">
  <div class="pane-slot" data-slot="home"><section class="pane active" data-pane="home" id="pane-home"></section></div>
  <div class="pane-slot" data-slot="workouts"><section class="pane" data-pane="workouts" id="pane-workouts"></section></div>
  <div class="pane-slot" data-slot="food"><section class="pane" data-pane="food" id="pane-food"></section></div>
  <div class="pane-slot" data-slot="progress"><section class="pane" data-pane="progress" id="pane-progress"></section></div>
  <div class="pane-slot" data-slot="insights"><section class="pane" data-pane="insights" id="pane-insights"></section></div>
</div>
<main id="view" hidden></main>

<nav id="tabs" aria-label="Sections"><span id="tab-bubble" aria-hidden="true"></span>
  <button class="tab" data-action="tab" data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24" data-icon="home" aria-hidden="true" focusable="false"><path d="M4 10.5 12 3.75l8 6.75v7.75a2 2 0 0 1-2 2h-3.25v-5a1.25 1.25 0 0 0-1.25-1.25h-3a1.25 1.25 0 0 0-1.25 1.25v5H6a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Home</span></button>
  <button class="tab" data-action="tab" data-tab="workouts" aria-label="Workouts"><svg viewBox="0 0 24 24" data-icon="workouts" aria-hidden="true" focusable="false"><rect x="6" y="5.5" width="3.5" height="13" rx="1.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="14.5" y="5.5" width="3.5" height="13" rx="1.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M6 8.5H4.75A1.75 1.75 0 0 0 3 10.25v3.5a1.75 1.75 0 0 0 1.75 1.75H6M18 8.5h1.25A1.75 1.75 0 0 1 21 10.25v3.5a1.75 1.75 0 0 1-1.75 1.75H18M9.5 12h5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Workouts</span></button>
  <button class="tab" data-action="tab" data-tab="food" aria-label="Food"><svg viewBox="0 0 24 24" data-icon="food" aria-hidden="true" focusable="false"><path d="M4.5 3.5V8A3.25 3.25 0 0 0 11 8V3.5M7.75 3.5v17M16.25 20.5v-17c2.25 1 3.5 3.75 3.5 7v2.75a1 1 0 0 1-1 1h-2.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Food</span></button>
  <button class="tab" data-action="tab" data-tab="progress" aria-label="Progress"><svg viewBox="0 0 24 24" data-icon="progress" aria-hidden="true" focusable="false"><path d="M4 4v13a3 3 0 0 0 3 3h13M8 14.5l3.25-3.75 3 2.5L19.5 7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Progress</span></button>
  <button class="tab" data-action="tab" data-tab="insights" aria-label="Insights"><svg viewBox="0 0 24 24" data-icon="insights" aria-hidden="true" focusable="false"><path d="M9.5 17.25v-2.3a6 6 0 1 1 5 0v2.3zM10 20.5h4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Insights</span></button>
</nav>

<section id="workout" hidden aria-label="Workout in progress"></section>
<section id="cardio-live" hidden aria-label="Cardio in progress"></section>

<div id="timer" hidden role="timer">
  <div id="timer-track"><div id="timer-bar"></div></div>
  <div class="timer-row">
    <div><span class="timer-lbl" id="timer-lbl">Rest</span><span id="timer-time">0:00</span></div>
    <div class="timer-btns">
      <button class="t-adj" data-action="t-adj" data-d="-15" aria-label="Subtract 15 seconds">−15</button>
      <button class="t-adj" data-action="t-adj" data-d="15" aria-label="Add 15 seconds">+15</button>
      <button data-action="t-skip" id="t-skip">Skip</button>
    </div>
  </div>
</div>

<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<button id="sw-update" class="shell-update" type="button" hidden aria-live="polite">Update available, tap to refresh</button>
<div id="onboard" hidden></div>
<div id="lock" hidden></div>
<div id="dialog" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
