/* Barcode scanner: the app opens the rear camera itself (so the live view always shows),
   then reads frames with the browser's built-in detector if it has one, or ZXing loaded on demand. */
let bcStream = null, bcTimer = null;
function stopBarcode() {
  clearInterval(bcTimer); bcTimer = null;
  if (bcStream) { bcStream.getTracks().forEach((t) => t.stop()); bcStream = null; }
  const v = $("#bc-video"); if (v) v.srcObject = null;
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function loadZXing() {
  if (window.ZXing) return;
  for (const src of ["https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js", "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"]) {
    try { await loadScript(src); if (window.ZXing) return; } catch (e) { /* try the next source */ }
  }
  throw new Error("scanner unavailable");
}
function bcStatus(t) { ui.sd.status = t; const el = $("#bc-status"); if (el) el.textContent = t; }
async function makeDetector(video) {
  if ("BarcodeDetector" in window) {
    try {
      const det = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
      return async () => { const r = await det.detect(video); return r && r[0] ? r[0].rawValue : null; };
    } catch (e) { /* fall through to ZXing */ }
  }
  await loadZXing();
  const Z = window.ZXing, reader = new Z.MultiFormatReader(), hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
  return async () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    const cw = Math.round(w * 0.86), ch = Math.round(h * 0.5);            // read the band inside the scan window
    canvas.width = cw; canvas.height = ch;
    ctx.drawImage(video, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, cw, ch);
    try {
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
      return reader.decode(bmp, hints).getText();
    } catch (e) { return null; }                                            // no barcode in this frame
  };
}
async function startBarcode() {
  const video = $("#bc-video");
  if (!video) return;
  stopBarcode();
  const btn = $("#bc-start"); if (btn) btn.hidden = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { bcStatus("This browser can't open the camera. Type the number under the barcode instead."); return; }
  try {
    bcStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (e) {
    bcStatus(e && e.name === "NotAllowedError"
      ? cameraBlockedText()
      : "Couldn't open the camera. Type the number under the barcode instead.");
    if (btn) btn.hidden = false;
    return;
  }
  if (ui.sheet !== "food-barcode") { stopBarcode(); return; }
  video.muted = true; video.setAttribute("playsinline", ""); video.setAttribute("autoplay", "");
  video.srcObject = bcStream;
  try { await video.play(); } catch (e) { if (btn) { btn.hidden = false; btn.textContent = "Tap to start the camera"; } }
  bcStatus("Line up the barcode inside the box.");
  let detect;
  try { detect = await makeDetector(video); }
  catch (e) { bcStatus("The scanner couldn't load. You can still type the number under the barcode."); return; }
  let busy = false;
  bcTimer = setInterval(async () => {
    if (busy || !bcStream) return;
    busy = true;
    try {
      const code = await detect();
      if (code && bcStream) { stopBarcode(); bcStatus(`Found ${code}. Looking it up…`); lookupBarcode(code); }
    } finally { busy = false; }
  }, 200);
}
async function lookupBarcode(code) {
  code = String(code || "").replace(/\D/g, "");
  if (code.length < 6) { toast("Enter the full barcode number."); return; }
  bcStatus("Looking it up…");
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,serving_size,serving_quantity,nutriments`);
    const j = await res.json();
    if (!j || j.status !== 1 || !j.product) { bcStatus("That product isn't in the database. Try a photo of the label or enter it manually."); return; }
    const p = j.product, n = p.nutriments || {};
    const kcal = (suffix) => n["energy-kcal" + suffix] != null ? +n["energy-kcal" + suffix] : n["energy" + suffix] != null ? +n["energy" + suffix] / 4.184 : null;
    const per = (suffix) => ({ kcal: kcal(suffix) || 0, p: +n["proteins" + suffix] || 0, c: +n["carbohydrates" + suffix] || 0, f: +n["fat" + suffix] || 0 });
    const per100 = per("_100g");
    let serving = null;
    if (kcal("_serving") != null) serving = per("_serving");
    else if (p.serving_quantity && kcal("_100g") != null) { const q = +p.serving_quantity / 100; serving = { kcal: per100.kcal * q, p: per100.p * q, c: per100.c * q, f: per100.f * q }; }
    if (kcal("_100g") == null && !serving) { bcStatus("Found it, but it has no nutrition info. Enter it manually instead."); return; }
    ui.sd.product = { code, name: p.product_name || "Packaged food", brand: (p.brands || "").split(",")[0], per100, serving, servingLabel: p.serving_size || "" };
    ui.sd.unit = serving ? "serving" : "g"; ui.sd.amt = serving ? "1" : "100";
    renderSheet();
  } catch (e) { bcStatus("Couldn't reach the food database. Check your connection."); }
}
/* merge cloud copy: union of entries per day, deletions respected, favorites by id */
function mergeFood(r) {
  if (!r) return;
  const f = food(), del = new Set([...(f.deleted || []), ...(r.deleted || [])]);
  const days = {};
  [r.days || {}, f.days].forEach((src) => Object.entries(src).forEach(([d, list]) => list.forEach((e) => {
    if (del.has(e.id)) return;
    const arr = (days[d] = days[d] || []);
    const k = arr.findIndex((x) => x.id === e.id);
    if (k >= 0) arr[k] = e; else arr.push(e);
  })));
  const saved = new Map();
  [...(r.saved || []), ...f.saved].forEach((s) => { if (!del.has(s.id)) saved.set(s.id, s); });
  const newerRemote = (r.updatedAt || 0) > (f.updatedAt || 0);
  state.food = { days, saved: [...saved.values()], targets: newerRemote && r.targets ? r.targets : f.targets, deleted: [...del], updatedAt: Math.max(r.updatedAt || 0, f.updatedAt || 0) };
}

/* ================= Cardio ================= */
const MACHINES = {
  treadmill: { name: "Incline treadmill", short: "Treadmill", icon: "🏃", fields: ["speed", "incline"] },
  stair:     { name: "StairMaster", short: "StairMaster", icon: "🪜", fields: ["level", "incline"] },
  elliptical:{ name: "Elliptical", short: "Elliptical", icon: "〰️", fields: ["level", "incline"] },
  bike:      { name: "Stationary bike", short: "Bike", icon: "🚲", fields: ["level"] },
  rower:     { name: "Rower", short: "Rower", icon: "🚣", fields: ["level"] },
};
function cardio() {
  if (!state.cardio) state.cardio = { sessions: [], saved: [], goalMin: 150, deleted: [], live: null, updatedAt: 0 };
  const c = state.cardio; c.sessions = c.sessions || []; c.saved = c.saved || []; c.deleted = c.deleted || []; if (!c.goalMin) c.goalMin = 150;
  return c;
}
const cid = () => "c_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function cardioTouch() { cardio().updatedAt = Date.now(); save(); }
const spUnit = () => (units() === "metric" ? "km/h" : "mph");
const mphToDisp = (mph) => (units() === "metric" ? mph * 1.609344 : mph);
const dispToMph = (v) => (units() === "metric" ? v / 1.609344 : v);
function bodyKg() { const w = weighIns().slice(-1)[0]; return w ? w.kg : 80; }

/* Calories per minute.
   Treadmill: ACSM metabolic equations (walking below 4.5 mph, running above), VO2 in ml/kg/min, ~5 kcal per litre of O2.
   Others: MET values scaled by level (1–20); kcal/min = MET × 3.5 × kg / 200. All are estimates. */
function kcalPerMin(machine, seg, kg) {
  const inc = Math.max(0, +seg.incline || 0) / 100;
  if (machine === "treadmill") {
    const S = Math.max(0, +seg.mph || 0) * 26.8224;               // metres per minute
    const vo2 = (+seg.mph || 0) < 4.5 ? 3.5 + 0.1 * S + 1.8 * S * inc : 3.5 + 0.2 * S + 0.9 * S * inc;
    return vo2 * kg / 1000 * 5;
  }
  const L = Math.max(1, Math.min(20, +seg.level || 1));
  const met = machine === "stair" ? (4 + 0.4 * L) * (1 + inc * 0.5)
    : machine === "elliptical" ? (4 + 0.25 * L) * (1 + inc * 0.5)
    : machine === "bike" ? 3.5 + 0.3 * L
    : 4.5 + 0.3 * L;
  return met * 3.5 * kg / 200;
}
function sessionKcal(s, kg) { return s.segments.reduce((n, g) => n + kcalPerMin(s.machine, g, kg) * (g.min || 0), 0); }
const sessionMin = (s) => s.segments.reduce((n, g) => n + (g.min || 0), 0);
function segText(machine, g) {
  const f = MACHINES[machine].fields, out = [];
  if (f.includes("speed")) out.push(`${fmtNum(Math.round(mphToDisp(g.mph || 0) * 10) / 10)} ${spUnit()}`);
  if (f.includes("level")) out.push(`level ${g.level || 1}`);
  if (f.includes("incline")) out.push(`${fmtNum(g.incline || 0)}%`);
  return out.join(" / ");
}
function sessionSummary(s) {
  const segs = s.segments.length > 1 ? `${s.segments.length} changes` : segText(s.machine, s.segments[0] || {});
  return `${Math.round(sessionMin(s))} min · ${segs}`;
}
function weekCardio() {
  const mon = mondayOf(today()), end = addDays(mon, 6);
  const list = cardio().sessions.filter((s) => s.date >= mon && s.date <= end);
  return { list, min: list.reduce((n, s) => n + sessionMin(s), 0), kcal: list.reduce((n, s) => n + (s.kcal || 0), 0) };
}
function cardioToday() { return cardio().sessions.filter((s) => s.date === today()).reduce((n, s) => n + (s.kcal || 0), 0); }

/* ---------- Live session ---------- */
function liveElapsedMs(L) {
  if (!L) return 0;
  const now = L.pausedAt || Date.now();
  return now - L.startedAt - (L.pausedMs || 0);
}
function liveSegments(L) {
  const total = liveElapsedMs(L) / 60000;
  return L.segments.map((g, i) => {
    const end = i + 1 < L.segments.length ? L.segments[i + 1].at : total;
    return { ...g, min: Math.max(0, end - g.at) };
  });
}
function startLive(machine, seg) {
  const c = cardio();
  c.live = { id: cid(), machine, startedAt: Date.now(), pausedMs: 0, pausedAt: null, segments: [{ ...seg, at: 0 }] };
  cardioTouch(); ui.cardioOpen = true; ui.sheet = null; render();
}
function finishLive() {
  const c = cardio(), L = c.live; if (!L) return null;
  const segs = liveSegments(L).filter((g) => g.min > 0.05).map(({ at, ...g }) => ({ ...g, min: Math.round(g.min * 10) / 10 }));
  c.live = null;
  if (!segs.length) { cardioTouch(); return null; }
  const s = { id: L.id, date: today(), machine: L.machine, segments: segs, startedAt: new Date(L.startedAt).toISOString(), finishedAt: new Date().toISOString(), src: "live" };
  s.kcal = Math.round(sessionKcal(s, bodyKg()));
  c.sessions.push(s); cardioTouch();
  return s;
}
function cardioLiveHTML() {
  const L = cardio().live; if (!L) return "";
  const m = MACHINES[L.machine], segs = liveSegments(L), cur = L.segments[L.segments.length - 1];
  const kc = segs.reduce((n, g) => n + kcalPerMin(L.machine, g, bodyKg()) * g.min, 0);
  return `<div class="wo-top cl-top"><button class="icon-btn" data-action="cl-min" aria-label="Back to home">${I.chevD}</button>
      <div class="wo-title"><h2>${m.icon} ${m.short}</h2><span class="sub">${L.pausedAt ? "Paused" : "In progress"}</span></div>
      <div class="wo-actions"><button class="btn small cancel" data-action="cl-cancel">Cancel</button><button class="btn small primary" data-action="cl-finish">Finish</button></div></div>
    <div class="cl-body">
      <div class="cl-time" id="cl-time">${fmtClock(liveElapsedMs(L))}</div>
      <div class="cl-kcal"><b id="cl-kcal">${Math.round(kc)}</b> cal burned (estimate)</div>
      <div class="card cl-now"><span class="mini-l" style="margin:0">Right now</span><b>${segText(L.machine, cur)}</b>
        <button class="btn primary block" data-action="cl-change">Change ${m.fields.includes("speed") ? "speed / incline" : "level / incline"}</button></div>
      <button class="btn block" data-action="cl-pause">${L.pausedAt ? "Resume" : "Pause"}</button>
      ${segs.length > 1 ? `<div class="mini-l">Segments</div><div class="card">${segs.map((g, i) => `<div class="cl-seg"><span>${i + 1}</span><b>${segText(L.machine, g)}</b><em>${fmtClock(g.min * 60000)}</em></div>`).join("")}</div>` : ""}
    </div>`;
}
function fmtClock(ms) { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }
function renderCardioLive() {
  const el = $("#cardio-live"); if (!el) return;
  const on = !!(cardio().live && ui.cardioOpen);
  el.hidden = !on; document.body.classList.toggle("in-cardio", on);
  if (on) el.innerHTML = cardioLiveHTML();
}
function tickCardio() {
  const L = state.cardio && state.cardio.live; if (!L) return;
  const t = $("#cl-time"); if (t) t.textContent = fmtClock(liveElapsedMs(L));
  const k = $("#cl-kcal"); if (k) k.textContent = Math.round(liveSegments(L).reduce((n, g) => n + kcalPerMin(L.machine, g, bodyKg()) * g.min, 0));
  const w = $("#cw-live"); if (w) w.textContent = fmtClock(liveElapsedMs(L));
}

/* ---------- Home widget ---------- */
function cardioWidgetHTML() {
  const wk = weekCardio(), goal = cardio().goalMin, L = cardio().live;
  const C = 2 * Math.PI * 30, f = Math.min(1, wk.min / goal);
  const ring = `<button class="cw-ring" data-action="cardio-open" aria-label="Cardio: ${Math.round(wk.min)} of ${goal} minutes this week">
    <svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="30" class="cw-bg"/><circle cx="38" cy="38" r="30" class="cw-fg" stroke-dasharray="${C * f} ${C}" transform="rotate(-90 38 38)"/></svg>
    <span><b>${Math.round(wk.min)}</b><small>/ ${goal} min</small></span></button>`;
  const right = L ? `<div class="cw-right"><span class="cw-label">${MACHINES[L.machine].name}</span><b class="cw-live" id="cw-live">${fmtClock(liveElapsedMs(L))}</b>
      <button class="btn small primary" data-action="cl-open">Resume</button></div>`
    : `<div class="cw-right"><span class="cw-label">Cardio this week${wk.kcal ? ` · ${Math.round(wk.kcal)} cal` : ""}</span>
      <button class="cw-btn" data-action="cardio-open">Saved & recent ${I.chevR}</button>
      <button class="cw-btn new" data-action="cardio-new">+ New</button></div>`;
  return `<section class="sec"><div class="sec-h"><h3>Cardio</h3></div><div class="card cw">${ring}${right}</div></section>`;
}

/* ---------- Cardio screen ---------- */
function recentCardio() {
  const seen = new Set(), out = [];
  [...cardio().sessions].sort((a, b) => (b.finishedAt || b.date).localeCompare(a.finishedAt || a.date)).forEach((s) => {
    const key = s.machine + "|" + s.segments.map((g) => [g.mph, g.level, g.incline, Math.round(g.min)].join(",")).join(";");
    if (!seen.has(key) && out.length < 8) { seen.add(key); out.push(s); }
  });
  return out;
}
function cardioScreenHTML() {
  const wk = weekCardio(), c = cardio();
  const item = (s, kind) => `<div class="ca-row"><button class="ca-main" data-action="ca-start" data-kind="${kind}" data-id="${s.id}" aria-label="Start ${esc(s.name || MACHINES[s.machine].name)}">
      <span class="ca-ic">${MACHINES[s.machine].icon}</span><span><b>${esc(s.name || MACHINES[s.machine].name)}</b><em>${sessionSummary(s)}</em></span></button>
    <button class="ca-log" data-action="ca-logas" data-kind="${kind}" data-id="${s.id}">Log</button>
    <button class="ca-go" data-action="ca-start" data-kind="${kind}" data-id="${s.id}" aria-label="Start">▶</button></div>`;
  const recent = recentCardio();
  return `<div class="detail-top"><button class="icon-btn" data-action="tab" data-tab="home" aria-label="Back">${I.chevL}</button></div>
    <div class="page-head"><div><h1 class="page-title">Cardio</h1><div class="page-sub">${Math.round(wk.min)} of ${c.goalMin} min this week</div></div>
      <button class="link-inline" data-action="ca-goal">Goal</button></div>
    ${c.live ? `<div class="card"><h4>${MACHINES[c.live.machine].name} in progress</h4><button class="btn primary block" data-action="cl-open">Resume</button></div>` : ""}
    <div class="ca-actions"><button class="btn primary" data-action="cardio-new">+ New session</button><button class="btn" data-action="ca-logform">Log finished cardio</button></div>
    ${c.saved.length ? `<div class="mini-l">Saved</div><div class="card ca-card">${c.saved.map((s) => item(s, "saved")).join("")}</div>` : ""}
    ${recent.length ? `<div class="mini-l">Recent</div><div class="card ca-card">${recent.map((s) => item(s, "recent")).join("")}</div>` : `<div class="card"><p class="sub">Your cardio shows up here after your first session, so you can restart it with one tap.</p></div>`}
    ${wk.list.length ? `<div class="mini-l">This week</div><div class="card">${[...wk.list].reverse().map((s) => `<button class="ca-hist" data-action="ca-detail" data-id="${s.id}">
      <span>${fmtDate(s.date, { weekday: "short" })} · ${MACHINES[s.machine].name}</span><b>${Math.round(sessionMin(s))} min · ${s.kcal} cal</b></button>`).join("")}</div>` : ""}
    <p class="hint">Calories are estimates from your speed, incline or level and your bodyweight (${fmtW(kgToDisp(bodyKg()))}). Machine displays usually read higher. Cardio calories show on the Food tab but don't change your food target.</p>`;
}

/* ---------- Sheets ---------- */
function machinePickerHTML(sel) {
  return `<div class="ma-grid">${Object.entries(MACHINES).map(([k, m]) => `<button class="ma" data-action="ma-pick" data-m="${k}" aria-pressed="${sel === k}"><span>${m.icon}</span>${m.short}</button>`).join("")}</div>`;
}
function stepField(id, label, val, step, unit) {
  return `<div class="stepper"><label for="${id}">${label}</label><div class="step-row">
    <button data-action="cf-step" data-f="${id}" data-d="-${step}" aria-label="${label} down">−</button>
    <input id="${id}" inputmode="decimal" value="${val}" data-cf="${id}">
    <button data-action="cf-step" data-f="${id}" data-d="${step}" aria-label="${label} up">+</button></div>${unit ? `<span class="cf-u">${unit}</span>` : ""}</div>`;
}
function segFieldsHTML(machine, g, prefix) {
  const f = MACHINES[machine].fields;
  return `<div class="steppers cf-grid">
    ${f.includes("speed") ? stepField(prefix + "sp", `Speed (${spUnit()})`, fmtNum(Math.round(mphToDisp(g.mph || 3) * 10) / 10), 0.1) : ""}
    ${f.includes("level") ? stepField(prefix + "lv", machine === "stair" ? "Speed level" : "Level", g.level || 8, 1) : ""}
    ${f.includes("incline") ? stepField(prefix + "in", "Incline (%)", fmtNum(g.incline != null ? g.incline : (machine === "treadmill" ? 12 : 0)), 0.5) : ""}
  </div>`;
}
function readSeg(machine, prefix) {
  const v = (id) => parseFloat(($("#" + prefix + id) || {}).value);
  const f = MACHINES[machine].fields, g = {};
  if (f.includes("speed")) g.mph = Math.max(0, dispToMph(v("sp") || 0));
  if (f.includes("level")) g.level = Math.max(1, Math.min(20, Math.round(v("lv") || 1)));
  if (f.includes("incline")) g.incline = Math.max(0, Math.min(40, v("in") || 0));
  return g;
}
function cardioNewSheetHTML() {
  const m = ui.sd.machine || "treadmill";
  return `<h3>New cardio session</h3>${machinePickerHTML(m)}
    <span class="field-label">Starting settings</span>${segFieldsHTML(m, ui.sd.seg || {}, "n-")}
    <button class="btn primary block" data-action="cn-start" style="margin-top:14px">Start timer</button>
    <p class="sub small">Tap "Change" during the session whenever you adjust the machine. Each change is logged separately.</p>`;
}
function cardioChangeSheetHTML() {
  const L = cardio().live; if (!L) return "";
  return `<h3>Change settings</h3><p class="sub" style="margin:-6px 0 12px">A new segment starts now.</p>
    ${segFieldsHTML(L.machine, L.segments[L.segments.length - 1], "c-")}
    <button class="btn primary block" data-action="cc-apply" style="margin-top:14px">Apply</button>`;
}
function cardioLogSheetHTML() {
  const m = ui.sd.machine || "treadmill", segs = ui.sd.segs && ui.sd.segs.length ? ui.sd.segs : [{ min: 30 }];
  ui.sd.segs = segs;
  const s = { machine: m, segments: segs };
  return `<h3>Log finished cardio</h3>${machinePickerHTML(m)}
    <label class="field-label" for="cl-date">Date</label><input class="text-in" id="cl-date" type="date" max="${today()}" value="${esc(ui.sd.date || today())}">
    ${segs.map((g, i) => `<div class="cl-segcard"><div class="cl-seghead"><b>${segs.length > 1 ? `Segment ${i + 1}` : "Session"}</b>${segs.length > 1 ? `<button class="set-x" data-action="cls-del" data-i="${i}" aria-label="Remove segment ${i + 1}">×</button>` : ""}</div>
      <div class="steppers cf-grid">${stepField(`l${i}-mn`, "Minutes", fmtNum(g.min || 0), 1)}</div>
      ${segFieldsHTML(m, g, `l${i}-`)}</div>`).join("")}
    <button class="link-btn" data-action="cls-add">+ Add a speed / incline change</button>
    <div class="fr-total"><b id="cls-kcal">${Math.round(sessionKcal(s, bodyKg()))} cal</b><span id="cls-min">${Math.round(sessionMin(s))} min total</span></div>
    <button class="btn primary block" data-action="cls-save">Save</button>`;
}
function readLogSegs() {
  const m = ui.sd.machine || "treadmill";
  return (ui.sd.segs || []).map((_, i) => ({ min: Math.max(0, parseFloat(($(`#l${i}-mn`) || {}).value) || 0), ...readSeg(m, `l${i}-`) }));
}
function cardioSummarySheetHTML() {
  const s = cardio().sessions.find((x) => x.id === ui.sd.id); if (!s) return "";
  return `<h3>${MACHINES[s.machine].icon} ${MACHINES[s.machine].name}</h3><p class="sub" style="margin:-6px 0 12px">${fmtDate(s.date, { weekday: "long", month: "short", day: "numeric" })}</p>
    <div class="stats"><div class="stat"><b>${Math.round(sessionMin(s))}<small> min</small></b><span>Time</span></div>
      <div class="stat"><b>${s.kcal}</b><span>Calories (estimate)</span></div></div>
    <div class="card">${s.segments.map((g, i) => `<div class="cl-seg"><span>${i + 1}</span><b>${segText(s.machine, g)}</b><em>${fmtNum(g.min)} min</em></div>`).join("")}</div>
    ${ui.sd.fresh ? `<label class="field-label" for="ca-name">Save it to start again with one tap (optional)</label>
      <div class="add-row" style="margin-top:0"><input id="ca-name" placeholder="e.g. Incline walk" autocomplete="off"><button data-action="ca-save">Save</button></div>` : ""}
    <div class="sheet-actions" style="margin-top:14px"><button class="btn danger" data-action="ca-del">Delete</button><button class="btn primary" data-action="sheet-close">Done</button></div>`;
}
function cardioGoalSheetHTML() {
  const cur = cardio().goalMin;
  return `<h3>Weekly cardio goal</h3><p class="sub" style="margin:-6px 0 14px">Minutes of cardio per week (Monday to Sunday). 150 minutes of moderate cardio a week is a common health guideline.</p>
    <div class="seg7" style="grid-template-columns:repeat(4,1fr)">${[60, 90, 120, 150, 180, 240, 300, 360].map((n) => `<button data-action="ca-goal-set" data-n="${n}" aria-pressed="${cur === n}">${n}</button>`).join("")}</div>`;
}
function updateLogTotals() {
  const s = { machine: ui.sd.machine || "treadmill", segments: readLogSegs() };
  const k = $("#cls-kcal"), m = $("#cls-min");
  if (k) k.textContent = Math.round(sessionKcal(s, bodyKg())) + " cal";
  if (m) m.textContent = Math.round(sessionMin(s)) + " min total";
}
function mergeCardio(r) {
  if (!r) return;
  const c = cardio(), del = new Set([...(c.deleted || []), ...(r.deleted || [])]);
  const by = new Map(); [...(r.sessions || []), ...c.sessions].forEach((s) => { if (!del.has(s.id)) by.set(s.id, s); });
  const sv = new Map(); [...(r.saved || []), ...c.saved].forEach((s) => { if (!del.has(s.id)) sv.set(s.id, s); });
  const newer = (r.updatedAt || 0) > (c.updatedAt || 0);
  state.cardio = { sessions: [...by.values()], saved: [...sv.values()], deleted: [...del], goalMin: newer && r.goalMin ? r.goalMin : c.goalMin, live: c.live, updatedAt: Math.max(r.updatedAt || 0, c.updatedAt || 0) };
}

/* ================= Platform (iPhone / Android) ================= */

const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* ================= Appearance ================= */
const ACCENTS = [
  { id: "citrus", name: "Citrus", c: ["#D5F56B", "#C7B5FA", "#F5BEDB"] },
  { id: "sea", name: "Sea Glass", c: ["#2D6876", "#67B39F", "#CEDFCC"] },
  { id: "dusk", name: "Dusk", c: ["#A9B8FF", "#CDBEF3", "#F3CAD6"] },
  { id: "sand", name: "Sandstone", c: ["#F4BE8C", "#E7D3BC", "#CBDCC4"] },
];
function applyTheme() {
  const t = state.theme || {};
  const root = document.documentElement;
  root.dataset.mode = t.mode === "light" ? "light" : "dark";
  root.dataset.accent = ACCENTS.some((a) => a.id === t.accent) ? t.accent : "citrus";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", root.dataset.mode === "light" ? "#F3F4F1" : "#0F0F11");
}
applyTheme();
function appearanceHTML() {
  const t = state.theme || {};
  return `<div class="group-label">Appearance</div>
    <div class="group">
      <div class="mode-row"><div class="seg2" role="radiogroup" aria-label="Mode">
        <button data-action="theme-mode" data-m="dark" aria-pressed="${t.mode !== "light"}">Dark</button>
        <button data-action="theme-mode" data-m="light" aria-pressed="${t.mode === "light"}">Light</button></div></div>
      <div class="swatches" role="radiogroup" aria-label="Accent colors">${ACCENTS.map((a) =>
        `<button class="sw" data-action="theme-accent" data-a="${a.id}" aria-pressed="${(t.accent || "citrus") === a.id}">
          <span class="sw-dots">${a.c.map((c) => `<i style="background:${c}"></i>`).join("")}</span><span>${a.name}</span></button>`).join("")}</div>
    </div>`;
}

/* ================= Rendering ================= */
function render() {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-current", t.dataset.tab === ui.tab ? "page" : "false"));
  const v = $("#view");
  if (ui.tab === "home") v.innerHTML = homeHTML();
  else if (ui.tab === "workouts") v.innerHTML = ui.detail && workoutById(ui.detail) ? detailHTML() : workoutsHTML();
  else if (ui.tab === "insights") v.innerHTML = insightsWrapHTML();
  else if (ui.tab === "food") v.innerHTML = foodHTML();
  else if (ui.tab === "cardio") v.innerHTML = cardioScreenHTML();
  else if (ui.tab === "progress") v.innerHTML = PH.ready ? photosHTML() : `<div class="page-head"><div><h1 class="page-title">Progress</h1><div class="page-sub">Loading…</div></div></div>`;
  else v.innerHTML = settingsHTML();
  renderWorkout();
  renderCardioLive();
  renderSheet();
  tick();
}

function startChips(label) {
  return `<p class="hero-s">${label}</p><div class="chips">${state.workouts.map((w) =>
    `<button class="chip" data-action="start" data-id="${esc(w.id)}">${esc(w.name)}</button>`).join("")}</div>`;
}

function homeHTML() {
  const t = today();
  const active = activeSession();
  const planned = state.plan[t];
  const doneToday = sessionsOn(t).filter((s) => s.finishedAt);
  let hero;
  if (active) {
    hero = `<div class="hero"><p class="hero-k">In progress</p><h2 class="hero-t">${esc(active.name)}</h2>
      <p class="hero-s">${pl(setCount(active), "set")} logged · started ${new Date(active.startedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</p>
      <button class="btn primary block" data-action="resume">Resume workout</button></div>`;
  } else if (planned && planned !== "rest" && workoutById(planned) && !doneToday.some((s) => s.workoutId === planned)) {
    const w = workoutById(planned);
    hero = `<div class="hero"><p class="hero-k">Planned for today</p><h2 class="hero-t">${esc(w.name)}</h2>
      <p class="hero-s">${pl(w.exercises.length, "exercise")}</p>
      <button class="btn primary block" data-action="start" data-id="${esc(w.id)}">Start ${esc(w.name)}</button></div>`;
  } else if (doneToday.length) {
    const sets = doneToday.reduce((n, s) => n + setCount(s), 0);
    hero = `<div class="hero"><p class="hero-k">Done today</p><h2 class="hero-t">${doneToday.map((s) => esc(s.name)).join(" + ")}</h2>
      ${startChips(`${pl(sets, "set")} logged. Train again?`)}</div>`;
  } else if (planned === "rest") {
    hero = `<div class="hero quiet"><p class="hero-k">Today</p><h2 class="hero-t">Rest day</h2>${startChips("Planned off. Changed your mind?")}</div>`;
  } else {
    hero = `<div class="hero quiet"><p class="hero-k">Today</p><h2 class="hero-t">Nothing planned</h2>${startChips("Start a workout now, or plan one below.")}</div>`;
  }

  const mon = addDays(mondayOf(t), ui.weekOffset * 7);
  const days = [...Array(7)].map((_, i) => addDays(mon, i));
  const weekLabel = ui.weekOffset === 0 ? "This week" : ui.weekOffset === 1 ? "Next week" : ui.weekOffset === -1 ? "Last week"
    : `${fmtDate(days[0], { month: "short", day: "numeric" })} – ${fmtDate(days[6], { month: "short", day: "numeric" })}`;
  const week = days.map((d) => {
    const done = sessionsOn(d);
    const p = state.plan[d];
    const past = d < t;
    let cls = "wk", label = "";
    if (done.length) { cls += " done"; label = done.map((s) => s.name).join("+"); }
    else if (p === "rest") { cls += " planned"; label = "Rest"; }
    else if (p && workoutById(p)) { cls += " planned"; label = workoutById(p).name; }
    else label = past ? "" : "+";
    if (d === t) cls += " today";
    if (past) cls += " past";
    const aria = `${fmtDate(d, { weekday: "long", month: "long", day: "numeric" })}${label && label !== "+" ? ", " + label : ""}`;
    return `<button class="${cls}" data-action="plan" data-date="${d}" ${past ? "disabled" : ""} aria-label="${esc(aria)}">
      <span class="wk-d">${fmtDate(d, { weekday: "short" }).slice(0, 3)}</span>
      <span class="wk-n">${parseDay(d).getDate()}</span>
      <span class="wk-w">${esc(label)}</span></button>`;
  }).join("");

  const thisMon = mondayOf(t);
  const hit = musclesBetween(thisMon, addDays(thisMon, 6));
  const hitSet = new Set(hit.keys());
  const keys = Object.keys(MUSCLES).sort((a, b) => (hit.get(b) || 0) - (hit.get(a) || 0));

  return `
    <div class="page-head"><div><h1 class="page-title">${firstName() ? `Hi, ${esc(firstName())}` : fmtDate(t, { weekday: "long" })}</h1>
      <div class="page-sub">${firstName() ? `${greeting()} · ` : ""}${fmtDate(t, { weekday: "long", month: "long", day: "numeric" })}</div></div>
      <button class="avatar" data-action="tab" data-tab="settings" aria-label="Settings">${firstName() ? esc((state.profile.name.trim().split(/\s+/).map((x) => x[0]).join("").slice(0, 2)).toUpperCase()) : `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h8M16 7h4M4 12h2M10 12h10M4 17h10M18 17h2"/><circle cx="14" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>`}</button></div>
    ${readinessCardHTML()}${weighReminderHTML()}${hero}
    <section class="sec">
      <div class="sec-h"><h3>${weekLabel}</h3>
        <div class="week-nav">${ui.weekOffset === 0 ? weekGoalHeadHTML() : ""}
          <button class="icon-btn" data-action="week" data-d="-1" aria-label="Previous week">${I.chevL}</button>
          <button class="icon-btn" data-action="week" data-d="1" aria-label="Next week"><span style="transform:scaleX(-1);display:grid">${I.chevL}</span></button>
        </div></div>
      <div class="week">${week}</div>${ui.weekOffset === 0 ? weekGoalLineHTML() : ""}
    </section>
    ${cardioWidgetHTML()}
    <section class="sec">
      <div class="sec-h"><h3>Muscles this week</h3><span class="sec-sub">${hitSet.size} of ${Object.keys(MUSCLES).length} trained</span></div>
      <div class="bodies">
        <div class="body-wrap">${bodySVG("front", hit)}<div class="body-cap">Front</div></div>
        <div class="body-wrap">${bodySVG("back", hit)}<div class="body-cap">Back</div></div>
      </div>
      <div class="legend"><span><i></i>Not yet</span><span><i class="lo"></i>1–5 sets</span><span><i class="hi"></i>6+ sets</span></div>
      <ul class="mgrid">${keys.map((k) => `<li class="${(hit.get(k) || 0) >= 6 ? "hit" : hit.get(k) ? "hit-lo" : ""}"><span>${MUSCLES[k]}</span><b>${hit.get(k) ? pl(hit.get(k), "set") : "–"}</b></li>`).join("")}</ul>
    </section>`;
}

function historyHTML(embedded) {
  const list = finished().filter((s) => setCount(s) > 0);
  const head = embedded ? `<p class="sub" style="margin:0 0 10px">${pl(list.length, "workout")} logged</p>`
    : `<div class="page-head"><div><h1 class="page-title">History</h1><div class="page-sub">${pl(list.length, "workout")} logged</div></div></div>`;
  if (!list.length) return head + `<p class="empty" style="padding-left:0">Finished workouts show up here. Start one from Home or Workouts.</p>`;
  return head + `<ul class="hist">${list.map((s) => {
    const dur = s.startedAt && s.finishedAt ? fmtDur(new Date(s.finishedAt) - new Date(s.startedAt)) : "";
    return `<li><details><summary>
        <div><div class="hist-t">${esc(s.name)}</div><div class="hist-d">${fmtDate(s.date)}${dur ? " · " + dur : ""}</div></div>
        <div class="hist-n">${setCount(s)}<span>sets</span></div></summary>
      <div class="hist-body">${s.entries.filter((e) => e.sets.length).map((e) =>
        `<div class="hist-ex"><b>${esc(e.exercise)}</b><span class="hs-row">${e.sets.map((x, j) => `<button class="hs${x.tag === "warmup" ? " wu" : ""}" data-action="hist-set" data-id="${esc(s.id)}" data-ex="${esc(e.exercise)}" data-s="${j}" aria-label="Edit set ${j + 1} of ${esc(e.exercise)}">${x.tag === "warmup" ? "W " : ""}${fmtSet(x)}</button>`).join("")}</span></div>`).join("")}
        <div class="hist-actions"><button class="link-btn" data-action="summary" data-id="${esc(s.id)}">View summary</button>
        <button class="link-btn danger" data-action="delete-s" data-id="${esc(s.id)}">Delete this workout</button></div></div>
      </details></li>`;
  }).join("")}</ul>`;
}

  el.innerHTML = `<div class="wo-top">

function exerciseHTML(s, e, i) {
  const done = setsFor(s, e.name);
  const prev = lastSets(e.name, s.id);
  const open = ui.open === i;
  let html = `<li class="ex${open ? " open" : ""}">
    <button class="ex-head" data-action="toggle" data-i="${i}" aria-expanded="${open}">
      <span class="ex-name">${esc(e.name)}</span>
      <span class="ex-count${done.length ? " has" : ""}">${done.filter(isWork).length || (done.length ? "W" : "")}</span>
      <span class="ex-last">${e.original ? `Swapped in for ${esc(e.original)} · ` : ""}${esc(prev ? "Last: " + prev.filter((x) => x.tag !== "warmup").map(fmtSet).join(", ") : "No previous sets")}</span>
    </button>`;
  if (open) {
    const d = draftFor(s, e.name);
    const worked = done.filter(isWork).length;
    let wi = 0;
    html += `<div class="panel"><div class="panel-top"><button class="link-inline" data-action="swap-open" data-i="${i}">Swap exercise</button></div>
      ${worked ? "" : suggestionHTML(suggestion(e.name, s.id), i)}
      ${done.length ? `<ol class="sets">${done.map((x, j) => `
      <li><span class="set-n${x.tag === "warmup" ? " wu" : ""}">${x.tag === "warmup" ? "W" : ++wi}</span><button class="set-v set-edit" data-action="set-edit" data-i="${i}" data-s="${j}" aria-label="Edit set ${j + 1}">${fmtSet(x)}${x.tag === "failure" || (x.pr && x.pr.length) ? `<span class="set-badges">${x.tag === "failure" ? `<span class="badge fail">F</span>` : ""}${x.pr && x.pr.length ? `<span class="badge pr">PR</span>` : ""}</span>` : ""}</button>
      <button class="set-x" data-action="delset" data-i="${i}" data-s="${j}" aria-label="Remove set ${j + 1}">×</button>
      ${x.note ? `<span class="set-note">${esc(x.note)}</span>` : ""}</li>`).join("")}</ol>` : ""}
      <div class="steppers">
        <div class="stepper"><label for="w-${i}">Weight (${wUnit()})</label><div class="step-row">
          <button data-action="step" data-field="w" data-d="-${wStep()}" data-i="${i}" aria-label="Weight minus ${wStep()}">−</button>
          <input id="w-${i}" data-field="w" data-i="${i}" inputmode="decimal" autocomplete="off" placeholder="BW" value="${esc(d.w)}">
          <button data-action="step" data-field="w" data-d="${wStep()}" data-i="${i}" aria-label="Weight plus ${wStep()}">+</button></div></div>
        <div class="stepper"><label for="r-${i}">Reps</label><div class="step-row">
          <button data-action="step" data-field="r" data-d="-1" data-i="${i}" aria-label="Reps minus 1">−</button>
          <input id="r-${i}" data-field="r" data-i="${i}" inputmode="numeric" autocomplete="off" placeholder="0" value="${esc(d.r)}">
          <button data-action="step" data-field="r" data-d="1" data-i="${i}" aria-label="Reps plus 1">+</button></div></div>
      </div>
      <input class="note" data-field="note" data-i="${i}" autocomplete="off" placeholder="Note (optional)" value="${esc(d.note)}">
      <div class="tags" role="group" aria-label="Set type">
        <button data-action="tag" data-t="warmup" data-i="${i}" aria-pressed="${d.tag === "warmup"}">Warm-up</button>
        <button data-action="tag" data-t="failure" data-i="${i}" aria-pressed="${d.tag === "failure"}">To failure</button></div>
      <button class="log" data-action="log" data-i="${i}">${d.tag === "warmup" ? "Log warm-up" : `Log set ${worked + 1}`}</button></div>`;
  }
  return html + "</li>";
}

/* ================= Rest timer ================= */
const timer = { end: 0, total: 0, done: false };
let audio = null;
function ensureAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) { audio = null; }
}
function beep() {
  try { if (navigator.vibrate) navigator.vibrate([220, 120, 220]); } catch (e) {}
  if (!audio) return;
  const t0 = audio.currentTime;
  [0, 0.25, 0.5].forEach((off) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0 + off);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + off + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18);
    o.connect(g).connect(audio.destination);
    o.start(t0 + off); o.stop(t0 + off + 0.2);
  });
}
function startTimer() { timer.total = state.restSeconds; timer.end = Date.now() + timer.total * 1000; timer.done = false; tick(); }
function stopTimer() { timer.end = 0; timer.done = false; tick(); }
function tick() {
  tickCardio();
  const s = activeSession();
  const el = $("#timer");
  document.body.classList.toggle("timer-on", !!(timer.end && s));
  if (!timer.end || !s) { el.hidden = true; }
  else {
    el.hidden = false;
    const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    if (left === 0 && !timer.done) { timer.done = true; beep(); }
    el.classList.toggle("done", timer.done);
    $("#timer-lbl").textContent = timer.done ? "Rest done" : "Rest";
    $("#timer-time").textContent = timer.done ? "Go" : fmtTime(left);
    $("#t-skip").textContent = timer.done ? "Dismiss" : "Skip";
    $("#timer-bar").style.transform = `scaleX(${timer.done ? 0 : Math.min(1, left / timer.total)})`;
  }
  const el2 = $("#elapsed");
  if (el2 && s && s.startedAt) {
    const sec = Math.floor((Date.now() - new Date(s.startedAt)) / 1000);
    el2.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")} elapsed · ${pl(setCount(s), "set")}`;
  }
}

function logSet(i) {
  const s = activeSession(); if (!s) return;
  const e = liveExercises(s)[i];
  const d = draftFor(s, e.name);
  const wRaw = String(d.w).trim();
  const w = wRaw === "" ? null : parseFloat(wRaw);
  const r = parseInt(d.r, 10);
  if (wRaw !== "" && (isNaN(w) || w < 0)) { toast("Weight needs to be a number. Leave it blank for bodyweight."); return; }
  if (!r || r < 1) { toast("Enter your reps first."); return; }
  let entry = s.entries.find((x) => x.exercise === e.name);
  if (!entry) { entry = { exercise: e.name, muscles: [...e.muscles], sets: [] }; s.entries.push(entry); }
  entry.muscles = [...e.muscles];
  const set = { w, r, note: d.note.trim() || undefined, at: new Date().toISOString() };
  if (d.tag) set.tag = d.tag;
  entry.sets.push(set);
  s.mod = Date.now();
  const prs = prsFor(e.name, set, s.date);
  if (prs.length) set.pr = prs;
  delete ui.drafts[e.name];
  save(); startTimer(); renderWorkout(); tick();
  if (prs.length) celebrate(e.name, set);
}

function deleteSet(i, j) {
  const s = activeSession(); if (!s) return;
  const e = liveExercises(s)[i];
  const entry = s.entries.find((x) => x.exercise === e.name);
  if (!entry || !entry.sets[j]) return;
  const [removed] = entry.sets.splice(j, 1);
  s.mod = Date.now();
  const entryIndex = s.entries.indexOf(entry);
  if (!entry.sets.length) s.entries = s.entries.filter((x) => x !== entry);
  delete ui.drafts[e.name];
  save(); renderWorkout(); tick();
  toast(`Removed ${fmtSet(removed)} from ${e.name}`, () => {
    if (!s.entries.includes(entry)) s.entries.splice(entryIndex, 0, entry);
    entry.sets.splice(j, 0, removed);
    s.mod = Date.now();
    delete ui.drafts[e.name];
    save(); renderWorkout(); tick();
  });
}

/* Drag to reorder exercises (Workouts tab) */
let drag = null;
document.addEventListener("pointerdown", (ev) => {
  const h = ev.target.closest(".handle");
  if (!h) return;
  const li = h.closest(".erow");
  const rows = [...document.querySelectorAll("#elist .erow")];
  drag = { li, rows, from: rows.indexOf(li), to: rows.indexOf(li), startY: ev.clientY, step: li.offsetHeight + 8, id: ev.pointerId };
  li.classList.add("dragging");
  rows.forEach((r) => { if (r !== li) r.classList.add("shifting"); });
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  ev.preventDefault();
});
document.addEventListener("pointermove", (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  const n = drag.rows.length;
  const dy = Math.max(-drag.from * drag.step, Math.min((n - 1 - drag.from) * drag.step, ev.clientY - drag.startY));
  drag.li.style.transform = `translateY(${dy}px)`;
  drag.to = Math.max(0, Math.min(n - 1, drag.from + Math.round(dy / drag.step)));
  drag.rows.forEach((r, j) => {
    if (r === drag.li) return;
    let shift = 0;
    if (drag.from < drag.to && j > drag.from && j <= drag.to) shift = -drag.step;
    if (drag.from > drag.to && j < drag.from && j >= drag.to) shift = drag.step;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
});
function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  const { from, to } = drag;
  drag = null;
  if (from !== to) {
    const w = workoutById(ui.detail);
    const [moved] = w.exercises.splice(from, 1);
    w.exercises.splice(to, 0, moved);

}

    case "delete-s": {
      const s = state.sessions.find((x) => x.id === b.dataset.id);
      if (!s || !(await ask({ title: `Delete this ${s.name} workout?`, body: `${fmtDate(s.date)}, ${pl(setCount(s), "set")}. This can't be undone.`, ok: "Delete", danger: true }))) break;
      state.sessions = state.sessions.filter((x) => x !== s);
      state.deleted = [...(state.deleted || []), s.id];
      save(); render(); break;
    }
    case "rest": state.restSeconds = +b.dataset.s; save(); render(); break;
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
  }
});

render();
initCloud();
</script>
</body>
</html>
