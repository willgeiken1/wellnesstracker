<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#15171A">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #15171A;
  --surface: #1E2125;
  --raised: #282C31;
  --line: #2F343A;
  --text: #F2F3F5;
  --muted: #8E959E;
  --green: #2FD27A;
  --green-ink: #062B16;
  --green-soft: rgba(47, 210, 122, .14);
  --red: #FF5A4E;
  --muscle: #3A3E44;
  --skin: #2A2D31;
  --base: #2A2D31;
  --green-lo: #A6E3BF;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tabs-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 17px; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input { font: inherit; color: var(--text); -webkit-appearance: none; appearance: none; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; }

/* ---------- Shell ---------- */
#view { padding: calc(14px + var(--safe-top)) 16px calc(var(--tabs-h) + 110px + var(--safe-bottom)); max-width: 640px; margin: 0 auto; }
.page-title { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.05; }
.page-sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; gap: 12px; }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(21, 23, 26, .94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: var(--safe-bottom); }
.tab { height: var(--tabs-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 500; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--green); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: 12px; font-weight: 600; font-size: 17px; background: var(--raised); }
.btn:active { filter: brightness(.9); }
.btn.primary { background: var(--green); color: var(--green-ink); }
.btn.danger { color: var(--red); }
.btn.block { width: 100%; }
.btn.small { height: 40px; padding: 0 14px; font-size: 15px; border-radius: 10px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--text); }
.icon-btn:active { background: var(--raised); }
.icon-btn svg { width: 24px; height: 24px; }

.sec { margin-top: 30px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 12px; }
.sec-h h3 { font-family: var(--display); font-weight: 600; font-size: 24px; }
.sec-sub { color: var(--muted); font-size: 15px; }

/* ---------- Home: today ---------- */
.hero { background: var(--surface); border-radius: 18px; padding: 18px; border-left: 4px solid var(--green); }
.hero.quiet { border-left-color: var(--line); }
.hero-k { color: var(--muted); font-size: 15px; margin: 0; }
.hero-t { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; margin: 4px 0 6px; }
.hero-s { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--raised); font-weight: 600; }
.chip:active { background: var(--line); }

/* ---------- Home: week planner ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 10px; border-radius: 12px; background: var(--surface); min-width: 0; border: 1.5px solid transparent; }
.wk:disabled { cursor: default; }
.wk-d { font-size: 12px; color: var(--muted); }
.wk-n { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; }
.wk-w { font-size: 11.5px; font-weight: 600; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; min-height: 15px; }
.wk.today { border-color: var(--text); }
.wk.planned .wk-w { color: var(--text); }
.wk.done { background: var(--green-soft); }
.wk.done .wk-w { color: var(--green); }
.wk.past:not(.done) { opacity: .45; }
.week-nav { display: flex; gap: 2px; margin-right: -8px; }
.week-nav .icon-btn { width: 36px; height: 36px; color: var(--muted); }

/* ---------- Home: muscles ---------- */
.bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--surface); border-radius: 18px; padding: 16px 8px 10px; }
.body-wrap { text-align: center; }
.body { width: 100%; max-width: 190px; height: auto; display: block; margin: 0 auto; }
.body-cap { color: var(--muted); font-size: 13px; margin-top: 6px; }
.body .base { fill: var(--base); }
.body .skin { fill: var(--skin); stroke: #111; stroke-width: .9; }
.body .mus { fill: var(--muscle); stroke: #111; stroke-width: .9; stroke-linejoin: round; cursor: pointer; transition: fill .3s; }
.body .mus.hit-lo { fill: var(--green-lo); }
.body .mus.hit { fill: var(--green); }
.body .line { stroke: #111; stroke-width: .9; fill: none; pointer-events: none; }
.body .detail { stroke: #111; stroke-width: .7; fill: none; stroke-linecap: round; pointer-events: none; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; margin: 14px 0 0; padding: 0; list-style: none; }
.mgrid li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--muted); }
.mgrid li.hit { color: var(--text); }
.mgrid li.hit b { color: var(--green); }
.mgrid li.hit-lo { color: var(--text); }
.mgrid li.hit-lo b { color: var(--green-lo); }
.legend { display: flex; gap: 16px; justify-content: center; color: var(--muted); font-size: 13px; padding: 4px 0 2px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--muscle); }
.legend i.lo { background: var(--green-lo); }
.legend i.hi { background: var(--green); }
.mgrid b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Workouts tab ---------- */
.wcard { display: grid; grid-template-columns: 1fr auto; align-items: center; width: 100%; text-align: left; background: var(--surface); border-radius: 16px; padding: 16px 12px 16px 18px; margin-bottom: 10px; }
.wcard:active { background: var(--raised); }
.wcard-t { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; }
.wcard-s { color: var(--muted); font-size: 14px; margin-top: 4px; line-height: 1.4; }
.chev { color: var(--muted); width: 22px; height: 22px; }

.detail-top { display: flex; align-items: center; justify-content: space-between; margin: -6px -8px 6px; }
.detail-actions { display: flex; gap: 4px; }
.link-btn { color: var(--muted); font-size: 15px; font-weight: 500; padding: 10px 8px; }
.link-btn.danger { color: var(--red); }
.elist { list-style: none; margin: 18px 0 0; padding: 0; position: relative; }
.erow { display: grid; grid-template-columns: 1fr 48px; align-items: center; background: var(--surface); border-radius: 14px; margin-bottom: 8px; position: relative; touch-action: pan-y; }
.erow.dragging { z-index: 3; background: var(--raised); box-shadow: 0 10px 28px rgba(0,0,0,.45); }
.erow.shifting { transition: transform .15s ease; }
.erow-main { text-align: left; padding: 14px 4px 14px 16px; min-width: 0; }
.erow-n { font-weight: 600; font-size: 17px; }
.erow-m { color: var(--muted); font-size: 14px; margin-top: 3px; }
.erow-m.none { color: var(--red); }
.handle { height: 100%; min-height: 56px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
.handle svg { width: 20px; height: 20px; }
.add-row-btn { width: 100%; height: 54px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--muted); font-weight: 600; }
.start-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + var(--safe-bottom)); padding: 12px 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 6; }
.start-bar .btn { max-width: 608px; margin: 0 auto; display: flex; }
body.timer-on:not(.in-workout) .start-bar { bottom: calc(var(--tabs-h) + var(--safe-bottom) + 78px); }
body.timer-on:not(.in-workout) #view { padding-bottom: calc(var(--tabs-h) + 190px + var(--safe-bottom)); }

/* ---------- History ---------- */
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { background: var(--surface); border-radius: 14px; margin-bottom: 8px; }
.hist summary { list-style: none; display: grid; grid-template-columns: 1fr auto; padding: 14px 16px; cursor: pointer; }
.hist summary::-webkit-details-marker { display: none; }
.hist-t { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.hist-d { color: var(--muted); font-size: 14px; margin-top: 2px; }
.hist-n { text-align: right; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.hist-n span { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); }
.hist-body { padding: 0 16px 14px; border-top: 1px solid var(--line); }
.hist-ex { padding: 10px 0 0; font-size: 15px; line-height: 1.45; }
.hist-ex b { font-weight: 600; display: block; }
.hist-ex span { color: var(--muted); }
.hist-body .link-btn { margin-top: 8px; padding-left: 0; }

/* ---------- Settings ---------- */
.group { background: var(--surface); border-radius: 16px; padding: 4px 16px; margin-bottom: 14px; }
.set-row { display: flex; justify-content: space-between; align-items: center; min-height: 54px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); gap: 12px; }
.set-row:last-child { border-bottom: 0; }
.set-row .sub { color: var(--muted); font-size: 15px; }
.group-label { color: var(--muted); font-size: 14px; margin: 22px 4px 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 0; }
.seg button { height: 44px; border-radius: 10px; background: var(--raised); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.hint { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 10px 4px 0; }

/* ---------- Active workout ---------- */
#workout { position: fixed; inset: 0; z-index: 12; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(120px + var(--safe-bottom)); }
.wo-top { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; padding: calc(8px + var(--safe-top)) 12px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
.wo-title { min-width: 0; }
.wo-title h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#elapsed { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0 auto; padding: 0; max-width: 640px; }
.ex { border-bottom: 1px solid var(--line); }
.ex.open { background: var(--surface); }
.ex-head { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; padding: 14px 16px; align-items: center; }
.ex-name { font-family: var(--display); font-weight: 600; font-size: 23px; line-height: 1.15; }
.ex-last { grid-column: 1; color: var(--muted); font-size: 15px; margin-top: 3px; }
.ex-count { grid-row: 1 / span 2; grid-column: 2; min-width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 19px; background: var(--raised); color: var(--muted); }
.ex-count.has { background: var(--green); color: var(--green-ink); }
.panel { padding: 0 16px 18px; }
.sets { list-style: none; margin: 0 0 14px; padding: 0; border-top: 1px solid var(--line); }
.sets li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; min-height: 46px; border-bottom: 1px solid var(--line); column-gap: 8px; }
.set-n { color: var(--muted); font-family: var(--display); font-size: 18px; }
.set-v { font-family: var(--display); font-weight: 600; font-size: 22px; }
.set-note { grid-column: 2; color: var(--muted); font-size: 14px; margin: -8px 0 8px; }
.set-x { grid-row: 1; grid-column: 3; width: 40px; height: 40px; color: var(--muted); font-size: 22px; border-radius: 20px; }
.set-x:active { background: var(--raised); }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper label { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.step-row { display: grid; grid-template-columns: 46px 1fr 46px; height: 56px; background: var(--bg); border-radius: 12px; overflow: hidden; }
.step-row button { font-size: 26px; color: var(--muted); }
.step-row button:active { background: var(--raised); color: var(--text); }
.step-row input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-family: var(--display); font-weight: 700; font-size: 28px; padding: 0; }
.step-row input::placeholder { color: #5D646C; }
.note { width: 100%; margin-top: 12px; height: 48px; border-radius: 12px; border: 0; background: var(--bg); padding: 0 14px; font-size: 16px; }
.note::placeholder { color: #6E757D; }
.log { width: 100%; margin-top: 12px; height: 58px; border-radius: 14px; background: var(--green); color: var(--green-ink); font-family: var(--display); font-weight: 700; font-size: 24px; }
.log:active { filter: brightness(.9); }
.empty { padding: 28px 16px; color: var(--muted); line-height: 1.5; }

/* ---------- Rest timer ---------- */
#timer { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + var(--safe-bottom)); z-index: 14; background: var(--raised); padding: 0 16px 12px; box-shadow: 0 -1px 0 var(--line); }
body.in-workout #timer { bottom: 0; padding-bottom: calc(12px + var(--safe-bottom)); }
#timer-track { height: 4px; margin: 0 -16px 10px; background: var(--line); }
#timer-bar { height: 100%; background: var(--green); transform-origin: left; transition: transform .25s linear; }
.timer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 608px; margin: 0 auto; }
.timer-lbl { color: var(--muted); font-size: 13px; display: block; }
#timer-time { font-family: var(--display); font-weight: 700; font-size: 38px; font-variant-numeric: tabular-nums; line-height: 1; }
.timer-btns { display: flex; gap: 6px; }
.timer-btns button { height: 44px; min-width: 52px; padding: 0 10px; border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 16px; }
#timer.done { background: var(--green); color: var(--green-ink); }
#timer.done .timer-lbl { color: var(--green-ink); opacity: .7; }
#timer.done #timer-track { background: transparent; }
#timer.done .t-adj { display: none; }
#timer.done .timer-btns button { background: rgba(0,0,0,.14); color: var(--green-ink); }

/* ---------- Bottom sheet ---------- */
#sheet { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.sheet-card { position: relative; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 16px calc(18px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto; max-width: 640px; width: 100%; margin: 0 auto; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet-card h3 { font-family: var(--display); font-weight: 700; font-size: 28px; margin-bottom: 14px; }
.opt { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 54px; padding: 0 16px; border-radius: 12px; background: var(--raised); margin-bottom: 8px; font-weight: 600; text-align: left; }
.opt[aria-pressed="true"] { background: var(--green-soft); color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
.opt.clear { background: none; color: var(--red); justify-content: center; }
.field-label { display: block; color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.text-in { width: 100%; height: 50px; border-radius: 12px; border: 0; background: var(--bg); padding: 0 14px; font-size: 17px; margin-bottom: 16px; }
.mchips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
.mchip { height: 38px; padding: 0 14px; border-radius: 19px; background: var(--raised); font-size: 15px; font-weight: 500; }
.mchip[aria-pressed="true"] { background: var(--green); color: var(--green-ink); font-weight: 600; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn.primary { flex: 1; }

#dialog { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,.6); }
.dlg { width: 100%; max-width: 360px; background: var(--surface); border-radius: 18px; padding: 20px; }
.dlg h3 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; margin-bottom: 8px; }
.dlg p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 18px; }
.dlg .text-in { margin-bottom: 18px; }
.dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.danger-fill { background: var(--red); color: #fff; }
.wo-actions { display: flex; gap: 6px; }
.btn.small.cancel { background: rgba(255, 90, 78, .15); color: var(--red); }
#toast { display: flex; align-items: center; justify-content: center; gap: 14px; }
#toast { pointer-events: none; }
#toast button { font-weight: 700; color: #0A7A3D; padding: 4px 6px; pointer-events: auto; }
.sheet-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 18px; background: var(--raised); color: var(--muted); font-size: 20px; line-height: 1; }
/* ---------- Recovery + Insights ---------- */
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.seg2 button { height: 40px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.card h4 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0; }
.sub.small { font-size: 13px; margin-top: 8px; }
.card .btn { margin-top: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.demo-banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: rgba(242,193,46,.12); color: #F2C12E; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.demo-banner button { color: #F2C12E; font-weight: 700; white-space: nowrap; padding: 4px; }
.ready { display: grid; grid-template-columns: 108px 1fr; gap: 16px; align-items: center; }
.ring { width: 108px; height: 108px; }
.ring-bg { fill: none; stroke: var(--raised); stroke-width: 9; }
.ring-fg { fill: none; stroke: var(--green); stroke-width: 9; stroke-linecap: round; }
.ring.ok .ring-fg { stroke: var(--green-lo); } .ring.down .ring-fg { stroke: var(--red); }
.ring-v { fill: var(--text); font-family: var(--display); font-weight: 700; font-size: 34px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.card .stat, #sheet .stat { background: var(--raised); }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; }
.stat b small { font-size: 15px; color: var(--muted); font-weight: 600; }
.stat > span { color: var(--muted); font-size: 13px; }
.stages { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0; gap: 2px; }
.stages i, .legend2 i { display: block; height: 100%; }
.s-deep { background: #3D7BE0; } .s-rem { background: #8E7CF0; } .s-light { background: #7FB3F5; } .s-awake { background: #8E959E; }
.legend2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; color: var(--muted); }
.legend2 i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.range { display: flex; gap: 6px; }
.range button { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted); }
.range button[aria-pressed="true"] { background: var(--text); color: #111; }
.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.chart .ln { fill: none; stroke: var(--green); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.alt { stroke: #7FB3F5; } .chart .ln-dot { fill: var(--green); } .chart .ln.alt-dot { fill: #7FB3F5; }
.chart .bar { fill: var(--green); opacity: .85; } .chart .bar.soft { fill: #7FB3F5; opacity: .7; }
.mini-l { color: var(--muted); font-size: 13px; margin-top: 12px; }
.rcard { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.rcard-n { width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 24px; border: 4px solid var(--green); }
.rcard-n.ok { border-color: var(--green-lo); } .rcard-n.down { border-color: var(--red); }

.rcard-s { font-size: 13px; }

.lift b { font-weight: 600; }
.lift-p { color: var(--muted); font-size: 13px; }

.chip-s.up { background: var(--green-soft); color: var(--green); }

.vol-row { display: grid; grid-template-columns: 96px 1fr 36px; gap: 8px; align-items: center; font-size: 14px; }

  if (pctWeek >= 0.4) { cls = "up"; label = "Progressing"; }
  else if (pctWeek <= -0.6) { cls = "down"; label = "Declining"; }
  else if (sincePR >= 3) { cls = "flat"; label = "Plateau"; }
  else { cls = "up"; label = "Holding steady"; }
  return { cls, label, pct, pctWeek, best, sincePR, weeks: Math.max(1, Math.round(span / 7)) };
}
/* Each session scored against that lift's previous 3 sessions, averaged across lifts (in %) */
function sessionPerf(sessions) {
  const hist = {}, out = [];
  [...sessions].sort((a, b) => a.date.localeCompare(b.date)).forEach((s) => {
    const ratios = [];
    s.entries.forEach((e) => {
      const vals = e.sets.map(e1rm).filter((v) => v != null);
      if (!vals.length) return;
      const v = Math.max(...vals), prev = (hist[e.exercise] || []).slice(-3);
      if (prev.length >= 2) ratios.push(v / avg(prev) - 1);
      (hist[e.exercise] = hist[e.exercise] || []).push(v);
    });
    if (ratios.length) out.push({ date: s.date, perf: avg(ratios) * 100 });
  });
  return out;
}
function effect(perfs, valueOf, buckets) {
  return buckets.map((b) => {
    const xs = perfs.filter((p) => { const v = valueOf(p.date); return v != null && b.test(v); }).map((p) => p.perf);
    return { label: b.label, avg: avg(xs), n: xs.length };

}
function effectCard(title, rows, sentence, need) {
  const max = Math.max(4, ...rows.filter((r) => r.n >= 3).map((r) => Math.abs(r.avg)));
  return `<div class="card"><h4>${title}</h4><p class="sub">${sentence || need}</p>
    <div class="cmp">${rows.map((r) => {
      const ok = r.n >= 3, v = ok ? r.avg : 0, w = Math.min(50, Math.abs(v) / max * 50);
      return `<div class="cmp-row"><span>${r.label}</span>
        <div class="cmp-bar"><i class="${v >= 0 ? "pos" : "neg"}" style="left:${v >= 0 ? 50 : 50 - w}%;width:${ok ? w : 0}%"></i><b></b></div>
        <span class="cmp-v">${ok ? signed(v) + "%" : `n=${r.n}`}</span></div>`;
    }).join("")}</div></div>`;
}
function compareSentence(rows, better, worse) {
  const hi = rows[rows.length - 1], lo = rows[0];

               : `Surprisingly, you've lifted ${Math.abs(d).toFixed(1)}% better ${worse} than ${better}.`;
}

/* ---------- Charts (hand-drawn SVG, no libraries) ---------- */
function chartSVG({ labels, series, h = 130, yMin, yMax, guide, fmt = (v) => Math.round(v) }) {
  const W = 340, P = { l: 30, r: 8, t: 10, b: 20 }, n = labels.length, iw = W - P.l - P.r, ih = h - P.t - P.b;
  const all = series.flatMap((s) => s.data.filter((v) => v != null)).concat(guide != null ? [guide] : []);
  if (!all.length) return "";
  let lo = yMin ?? Math.min(...all), hi = yMax ?? Math.max(...all);
  if (yMin == null || yMax == null) { const pad = (hi - lo) * 0.12 || 1; if (yMin == null) lo -= pad; if (yMax == null) hi += pad; }
  const X = (i) => P.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const Y = (v) => P.t + ih - (v - lo) / (hi - lo) * ih;
  let g = "";
  [0, 0.5, 1].forEach((f) => { const v = lo + (hi - lo) * f; g += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${P.l - 5}" y="${Y(v) + 3}" text-anchor="end">${fmt(v)}</text>`; });
  [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i).forEach((i) =>
    g += `<text class="ax" x="${X(i)}" y="${h - 5}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${fmtDate(labels[i], { month: "short", day: "numeric" })}</text>`);
  if (guide != null) g += `<line class="guide" x1="${P.l}" x2="${W - P.r}" y1="${Y(guide)}" y2="${Y(guide)}"/>`;
  series.forEach((s) => {
    if (s.type === "bar") {
      const bw = Math.max(2, iw / n * 0.6);
      s.data.forEach((v, i) => { if (v == null) return; const y = Y(Math.max(v, lo)); g += `<rect class="${s.cls || "bar"}" x="${X(i) - bw / 2}" y="${y}" width="${bw}" height="${Math.max(0, Y(lo) - y)}" rx="1.5"/>`; });
    } else {
      let d = "", started = false;
      s.data.forEach((v, i) => { if (v == null) { started = false; return; } d += `${started ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; started = true; });
      g += `<path class="${s.cls || "ln"}" d="${d}"/>`;
      const li = s.data.map((v, i) => v != null ? i : -1).filter((i) => i >= 0).pop();
      if (li != null) g += `<circle class="${s.cls || "ln"}-dot" cx="${X(li)}" cy="${Y(s.data[li])}" r="3"/>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}
function sparkSVG(vals, cls) {
  if (vals.length < 2) return `<svg class="spark" viewBox="0 0 92 34"></svg>`;
  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const d = vals.map((v, i) => `${i ? "L" : "M"}${(i / (vals.length - 1) * 88 + 2).toFixed(1)},${(30 - (v - lo) / r * 26).toFixed(1)}`).join("");
  return `<svg class="spark ${cls}" viewBox="0 0 92 34"><path d="${d}"/></svg>`;
}
function ringSVG(v, cls) {
  const C = 2 * Math.PI * 44;
  return `<svg class="ring ${cls}" viewBox="0 0 108 108" role="img" aria-label="Readiness ${v}">
    <circle cx="54" cy="54" r="44" class="ring-bg"/><circle cx="54" cy="54" r="44" class="ring-fg" stroke-dasharray="${C * v / 100} ${C}" transform="rotate(-90 54 54)"/>
    <text x="54" y="60" text-anchor="middle" class="ring-v">${v}</text></svg>`;
}

  const deleted = new Set([...(state.deleted || []), ...(r.deleted || [])]);
  const byId = new Map();
  [...(r.sessions || []), ...state.sessions].forEach((s) => {
    if (!s || deleted.has(s.id)) return;
    const cur = byId.get(s.id);
    if (!cur || setCount(s) > setCount(cur) || (s.finishedAt && !cur.finishedAt && setCount(s) >= setCount(cur))) byId.set(s.id, s);
  });
  state.sessions = [...byId.values()];
  if ((r.updatedAt || 0) > (state.updatedAt || 0)) {
    if (Array.isArray(r.workouts) && r.workouts.length) state.workouts = r.workouts;
    if (r.plan) state.plan = r.plan;
    if (r.restSeconds) state.restSeconds = r.restSeconds;
  }
  state.deleted = [...deleted];
}
async function cloudPull() {
  if (!sb || !session) return;
  try {
    const { data, error } = await sb.from("user_data").select("data").eq("user_id", session.user.id).maybeSingle();
    if (error) return;
    if (data && data.data) mergeRemote(data.data);
    save();
    render();
  } catch (e) { /* offline */ }
}

async function ouraRefresh(force) {
  if (!sb || !session || ouraBusy) return;
  ouraBusy = true;
  try {
    const { data: c } = await sb.from("oura_connections").select("*").eq("user_id", session.user.id).maybeSingle();
    state.oura.connected = !!c;
    state.oura.lastError = c ? c.last_error : null;
    if (c) {
      const stale = !c.last_sync || Date.now() - new Date(c.last_sync).getTime() > 3 * 3600_000;
      if (force || stale) {
        ui.ouraSyncing = true; render();
        const { error } = await sb.functions.invoke("oura-sync", { body: { days: c.last_sync ? 14 : 120 } });
        ui.ouraSyncing = false;
        if (error) toast("Couldn't sync Oura right now. Try Sync now in Settings.");
      }
      const { data: rows } = await sb.from("oura_days").select("day, data").eq("user_id", session.user.id).gte("day", addDays(today(), -150));
      if (rows) {
        const days = {};
        rows.forEach((r) => { days[r.day] = r.data; });
        state.oura.days = days;
        state.oura.lastSync = Date.now();
      }
    }
    save();
  } catch (e) { ui.ouraSyncing = false; }
  ouraBusy = false;
  render();
}

async function initCloud() {
  if (!sb) return;
  try {
    const { data } = await sb.auth.getSession();
    session = data.session;
    sb.auth.onAuthStateChange((_event, s) => { session = s; });
    if (session) { await cloudPull(); await ouraRefresh(false); }
    else render();
  } catch (e) { /* offline */ }
}

async function signIn(mode) {
  if (!sb) { toast("Can't reach the server. Check your connection."); return; }
  const email = ($("#authEmail") || {}).value?.trim();
  const password = ($("#authPw") || {}).value || "";
  if (!email || !email.includes("@")) { toast("Enter your email address."); return; }
  if (password.length < 6) { toast("Passwords need at least 6 characters."); return; }
  const btn = $('[data-action="auth-go"]');
  if (btn) { btn.disabled = true; btn.textContent = "One moment…"; }
  const res = mode === "signup" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (res.error) {
    if (btn) { btn.disabled = false; btn.textContent = mode === "signup" ? "Create account" : "Sign in"; }
    toast(res.error.message);
    return;
  }
  if (!res.data.session) { toast("Check your email to confirm your account, then sign in."); ui.sheet = null; render(); return; }
  session = res.data.session;
  ui.sheet = null;
  toast(mode === "signup" ? "Account created. Your workouts are backing up." : "Signed in.");
  await cloudPull();
  await ouraRefresh(false);
}
async function signOut() {
  if (sb) { try { await sb.auth.signOut(); } catch (e) {} }
  session = null;
  state.oura = { connected: false, lastSync: null, days: {} };
  save(); render();
  toast("Signed out. Your workouts are still saved on this phone.");
}
async function connectOura() {
  if (!sb) { toast("Can't reach the server. Check your connection."); return; }
  if (!session) { ui.sheet = "auth"; ui.sd = { mode: "signin", email: "" }; renderSheet(); toast("Sign in first, then connect Oura."); return; }
  const { data, error } = await sb.functions.invoke("oura-connect", { body: {} });
  if (error || !data || !data.url) { toast("Couldn't start the Oura connection. Check that the functions are deployed."); return; }
  state.demo = false; save();
  window.location.href = data.url;
}
async function disconnectOura() {
  if (!(await ask({ title: "Disconnect Oura?", body: "Your Oura data will be removed from Lift Log. You can reconnect any time.", ok: "Disconnect", danger: true }))) return;
  const { error } = await sb.functions.invoke("oura-connect", { body: { action: "disconnect" } });
  if (error) { toast("Couldn't disconnect right now."); return; }
  state.oura = { connected: false, lastSync: null, days: {} };
  save(); render(); toast("Oura disconnected.");
}

/* After Oura's login page sends you back here */
(function handleOuraReturn() {
  const p = new URLSearchParams(location.search).get("oura");
  if (!p) return;
  history.replaceState(null, "", location.pathname);
  const ok = p === "connected";
  setTimeout(() => ask({
    title: ok ? "Oura connected" : "Oura wasn't connected",
    body: ok ? "If there's a Done button in the corner, tap it to go back to Lift Log. Your Oura data loads there automatically."
             : p === "expired" ? "That login took too long. Open Recovery and tap Connect Oura again."
             : "The connection was cancelled or didn't finish. Open Recovery and tap Connect Oura to try again.",
    ok: "OK", cancel: "Close"
  }), 300);
})();

function syncedAgo() {
  if (!state.oura.lastSync) return "";
  const m = Math.round((Date.now() - state.oura.lastSync) / 60000);
  return m < 1 ? "Synced just now" : m < 60 ? `Synced ${m} min ago` : `Synced ${Math.round(m / 60)} h ago`;
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-current", t.dataset.tab === ui.tab ? "page" : "false"));
  const v = $("#view");
  if (ui.tab === "home") v.innerHTML = homeHTML();
  else if (ui.tab === "workouts") v.innerHTML = ui.detail && workoutById(ui.detail) ? detailHTML() : workoutsHTML();
  else if (ui.tab === "recovery") v.innerHTML = recoveryHTML();
  else if (ui.tab === "insights") v.innerHTML = insightsHTML();
  else v.innerHTML = settingsHTML();
  renderWorkout();
  renderSheet();
  tick();
}

function homeHTML() {
  const t = today();
  const active = activeSession();
  const planned = state.plan[t];
  const doneToday = sessionsOn(t).filter((s) => s.finishedAt);
  let hero;
  if (active) {
    hero = `<div class="hero"><p class="hero-k">In progress</p><h2 class="hero-t">${esc(active.name)}</h2>
      <p class="hero-s">${pl(setCount(active), "set")} logged · started ${new Date(active.startedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</p>
      <button class="btn primary block" data-action="resume">Resume workout</button></div>`;
  } else if (planned && planned !== "rest" && workoutById(planned) && !doneToday.some((s) => s.workoutId === planned)) {
    const w = workoutById(planned);
    hero = `<div class="hero"><p class="hero-k">Planned for today</p><h2 class="hero-t">${esc(w.name)}</h2>
      <p class="hero-s">${pl(w.exercises.length, "exercise")}</p>
      <button class="btn primary block" data-action="start" data-id="${esc(w.id)}">Start ${esc(w.name)}</button></div>`;
  } else if (doneToday.length) {
    const sets = doneToday.reduce((n, s) => n + setCount(s), 0);
    hero = `<div class="hero"><p class="hero-k">Done today</p><h2 class="hero-t">${doneToday.map((s) => esc(s.name)).join(" + ")}</h2>
      ${startChips(`${pl(sets, "set")} logged. Train again?`)}</div>`;
  } else if (planned === "rest") {
    hero = `<div class="hero quiet"><p class="hero-k">Today</p><h2 class="hero-t">Rest day</h2>${startChips("Planned off. Changed your mind?")}</div>`;
  } else {
    hero = `<div class="hero quiet"><p class="hero-k">Today</p><h2 class="hero-t">Nothing planned</h2>${startChips("Start a workout now, or plan one below.")}</div>`;
  }

  const mon = addDays(mondayOf(t), ui.weekOffset * 7);
  const days = [...Array(7)].map((_, i) => addDays(mon, i));
  const weekLabel = ui.weekOffset === 0 ? "This week" : ui.weekOffset === 1 ? "Next week" : ui.weekOffset === -1 ? "Last week"
    : `${fmtDate(days[0], { month: "short", day: "numeric" })} – ${fmtDate(days[6], { month: "short", day: "numeric" })}`;
  const week = days.map((d) => {
    const done = sessionsOn(d);
    const p = state.plan[d];
    const past = d < t;
    let cls = "wk", label = "";
    if (done.length) { cls += " done"; label = done.map((s) => s.name).join("+"); }
    else if (p === "rest") { cls += " planned"; label = "Rest"; }
    else if (p && workoutById(p)) { cls += " planned"; label = workoutById(p).name; }
    else label = past ? "" : "+";
    if (d === t) cls += " today";
    if (past) cls += " past";
    const aria = `${fmtDate(d, { weekday: "long", month: "long", day: "numeric" })}${label && label !== "+" ? ", " + label : ""}`;
    return `<button class="${cls}" data-action="plan" data-date="${d}" ${past ? "disabled" : ""} aria-label="${esc(aria)}">
      <span class="wk-d">${fmtDate(d, { weekday: "short" }).slice(0, 3)}</span>
      <span class="wk-n">${parseDay(d).getDate()}</span>
      <span class="wk-w">${esc(label)}</span></button>`;
  }).join("");

  const thisMon = mondayOf(t);
  const hit = musclesBetween(thisMon, addDays(thisMon, 6));
  const hitSet = new Set(hit.keys());
  const keys = Object.keys(MUSCLES).sort((a, b) => (hit.get(b) || 0) - (hit.get(a) || 0));

  return `
    <div class="page-head"><div><h1 class="page-title">${fmtDate(t, { weekday: "long" })}</h1>
      <div class="page-sub">${fmtDate(t, { month: "long", day: "numeric" })}</div></div></div>
    ${readinessCardHTML()}${hero}
    <section class="sec">
      <div class="sec-h"><h3>${weekLabel}</h3>
        <div class="week-nav">
          <button class="icon-btn" data-action="week" data-d="-1" aria-label="Previous week">${I.chevL}</button>
          <button class="icon-btn" data-action="week" data-d="1" aria-label="Next week"><span style="transform:scaleX(-1);display:grid">${I.chevL}</span></button>
        </div></div>
      <div class="week">${week}</div>
    </section>
    <section class="sec">
      <div class="sec-h"><h3>Muscles this week</h3><span class="sec-sub">${hitSet.size} of ${Object.keys(MUSCLES).length} trained</span></div>
      <div class="bodies">
        <div class="body-wrap">${bodySVG("front", hit)}<div class="body-cap">Front</div></div>
        <div class="body-wrap">${bodySVG("back", hit)}<div class="body-cap">Back</div></div>
      </div>
      <div class="legend"><span><i></i>Not yet</span><span><i class="lo"></i>1–5 sets</span><span><i class="hi"></i>6+ sets</span></div>
      <ul class="mgrid">${keys.map((k) => `<li class="${(hit.get(k) || 0) >= 6 ? "hit" : hit.get(k) ? "hit-lo" : ""}"><span>${MUSCLES[k]}</span><b>${hit.get(k) ? pl(hit.get(k), "set") : "–"}</b></li>`).join("")}</ul>
    </section>`;
}

      <label class="field-label" for="authPw">Password${up ? " (6+ characters)" : ""}</label>
      <input class="text-in" id="authPw" type="password" autocomplete="${up ? "new-password" : "current-password"}">
      <button class="btn primary block" data-action="auth-go">${up ? "Create account" : "Sign in"}</button>
      <button class="link-btn" style="display:block;margin:10px auto 0" data-action="auth-mode">${up ? "Already have an account? Sign in" : "New here? Create an account"}</button>`;
  } else if (ui.sheet === "lift") {
    inner = liftSheetHTML(ui.sd.name);
  } else if (ui.sheet === "exercise") {
    const editing = ui.sd.idx >= 0;
    inner = `<h3>${editing ? "Edit exercise" : "Add exercise"}</h3>
      <label class="field-label" for="exName">Name</label>
      <input class="text-in" id="exName" autocomplete="off" placeholder="e.g. Hack Squat" value="${esc(ui.sd.name)}">
      <span class="field-label">Muscles worked</span>
      <div class="mchips">${Object.keys(MUSCLES).map((k) =>
        `<button class="mchip" data-action="toggle-m" data-m="${k}" aria-pressed="${ui.sd.muscles.has(k)}">${MUSCLES[k]}</button>`).join("")}</div>
      <div class="sheet-actions">${editing ? `<button class="btn danger" data-action="ex-delete">Remove</button>` : ""}
        <button class="btn primary" data-action="ex-save">${editing ? "Save" : "Add exercise"}</button></div>`;
  }
  el.innerHTML = `<div class="sheet-back" data-action="sheet-close"></div>
    <div class="sheet-card" role="dialog" aria-modal="true"><div class="grabber"></div>
    <button class="sheet-x" data-action="sheet-close" aria-label="Close">×</button>${inner}</div>`;
}

/* ================= Rest timer ================= */
const timer = { end: 0, total: 0, done: false };
let audio = null;
function ensureAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) { audio = null; }
}
function beep() {
  if (!audio) return;
  const t0 = audio.currentTime;
  [0, 0.25, 0.5].forEach((off) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0 + off);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + off + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18);
    o.connect(g).connect(audio.destination);
    o.start(t0 + off); o.stop(t0 + off + 0.2);
  });
}
function startTimer() { timer.total = state.restSeconds; timer.end = Date.now() + timer.total * 1000; timer.done = false; tick(); }
function stopTimer() { timer.end = 0; timer.done = false; tick(); }
function tick() {
  const s = activeSession();
  const el = $("#timer");
  document.body.classList.toggle("timer-on", !!(timer.end && s));
  if (!timer.end || !s) { el.hidden = true; }
  else {
    el.hidden = false;
    const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    if (left === 0 && !timer.done) { timer.done = true; beep(); }
    el.classList.toggle("done", timer.done);
    $("#timer-lbl").textContent = timer.done ? "Rest done" : "Rest";
    $("#timer-time").textContent = timer.done ? "Go" : fmtTime(left);
    $("#t-skip").textContent = timer.done ? "Dismiss" : "Skip";
    $("#timer-bar").style.transform = `scaleX(${timer.done ? 0 : Math.min(1, left / timer.total)})`;
  }
  const el2 = $("#elapsed");
  if (el2 && s && s.startedAt) {
    const sec = Math.floor((Date.now() - new Date(s.startedAt)) / 1000);
    el2.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")} elapsed · ${pl(setCount(s), "set")}`;
  }
}
setInterval(tick, 500);
let lastWake = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  render();
  if (Date.now() - lastWake > 60_000) { lastWake = Date.now(); try { cloudPull().then(() => ouraRefresh(false)); } catch (e) {} }
});

/* ================= Actions ================= */
let toastUndo = null;
function toast(msg, undo) {
  const t = $("#toast");
  toastUndo = undo || null;
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-action="toast-undo">Undo</button>` : ""}`;
  t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; toastUndo = null; }, undo ? 5000 : 2600);
}

/* In-app dialogs. iOS can block the browser's built-in confirm() and prompt() in Home Screen apps. */
let dlgResolve = null;
function ask({ title, body = "", ok = "OK", cancel = "Cancel", danger = false, input = null }) {
  const el = $("#dialog");
  el.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
    <h3 id="dlg-t">${esc(title)}</h3>${body ? `<p>${esc(body)}</p>` : ""}
    ${input != null ? `<input class="text-in" id="dlg-in" autocomplete="off" value="${esc(input)}">` : ""}
    <div class="dlg-actions"><button class="btn" data-action="dlg-cancel">${esc(cancel)}</button>
    <button class="btn ${danger ? "danger-fill" : "primary"}" data-action="dlg-ok">${esc(ok)}</button></div></div>`;
  el.hidden = false;
  const inp = $("#dlg-in");
  if (inp) setTimeout(() => { inp.focus(); inp.select(); }, 50);
  return new Promise((res) => { dlgResolve = res; });
}
function closeDialog(ok) {
  const inp = $("#dlg-in");
  const val = inp ? inp.value.trim() : true;
  $("#dialog").hidden = true; $("#dialog").innerHTML = "";
  const r = dlgResolve; dlgResolve = null;
  if (r) r(ok ? (inp ? (val || null) : true) : (inp ? null : false));
}

async function startWorkout(id) {
  const w = workoutById(id);
  if (!w) return;
  const cur = activeSession();
  if (cur) {
    if (cur.workoutId === id) { openWorkout(); return; }
    if (!(await ask({ title: `${cur.name} is still in progress`, body: `Finish it and start ${w.name}?`, ok: "Finish and start" }))) return;
    finishSession(cur, true);
  }
  state.sessions.push({ id: uid(), date: today(), workoutId: w.id, name: w.name, startedAt: new Date().toISOString(), finishedAt: null, entries: [] });
  ui.drafts = {}; ui.open = 0;
  save(); openWorkout();
}
function openWorkout() { ui.workoutOpen = true; ui.sheet = null; render(); $("#workout").scrollTop = 0; }

function finishSession(s, quiet) {
  if (!setCount(s)) {
    state.sessions = state.sessions.filter((x) => x !== s);
    state.deleted = [...(state.deleted || []), s.id];
    if (!quiet) toast("Workout discarded. No sets were logged.");
  } else {
    s.finishedAt = new Date().toISOString();
    if (!quiet) toast(`${s.name} saved: ${pl(setCount(s), "set")} in ${fmtDur(new Date(s.finishedAt) - new Date(s.startedAt))}.`);
  }
  stopTimer(); ui.workoutOpen = false; ui.open = null; ui.drafts = {};
  save();
}

function logSet(i) {
  const s = activeSession(); if (!s) return;
  const e = liveExercises(s)[i];
  const d = draftFor(s, e.name);
  const wRaw = String(d.w).trim();
  const w = wRaw === "" ? null : parseFloat(wRaw);
  const r = parseInt(d.r, 10);
  if (wRaw !== "" && (isNaN(w) || w < 0)) { toast("Weight needs to be a number. Leave it blank for bodyweight."); return; }
  if (!r || r < 1) { toast("Enter your reps first."); return; }
  let entry = s.entries.find((x) => x.exercise === e.name);
  if (!entry) { entry = { exercise: e.name, muscles: [...e.muscles], sets: [] }; s.entries.push(entry); }
  entry.muscles = [...e.muscles];
  entry.sets.push({ w, r, note: d.note.trim() || undefined, at: new Date().toISOString() });
  delete ui.drafts[e.name];
  save(); startTimer(); renderWorkout(); tick();
}

function deleteSet(i, j) {
  const s = activeSession(); if (!s) return;
  const e = liveExercises(s)[i];
  const entry = s.entries.find((x) => x.exercise === e.name);
  if (!entry || !entry.sets[j]) return;
  const [removed] = entry.sets.splice(j, 1);
  const entryIndex = s.entries.indexOf(entry);
  if (!entry.sets.length) s.entries = s.entries.filter((x) => x !== entry);
  delete ui.drafts[e.name];
  save(); renderWorkout(); tick();
  toast(`Removed ${fmtSet(removed)} from ${e.name}`, () => {
    if (!s.entries.includes(entry)) s.entries.splice(entryIndex, 0, entry);
    entry.sets.splice(j, 0, removed);
    delete ui.drafts[e.name];
    save(); renderWorkout(); tick();
  });
}

async function exportData() {
  const data = JSON.stringify({ app: "liftlog", version: 2, exportedAt: new Date().toISOString(),
    restSeconds: state.restSeconds, workouts: state.workouts, plan: state.plan, sessions: state.sessions, oura: state.oura }, null, 2);
  const name = `workouts-${today()}.json`;
  const file = new File([data], name, { type: "application/json" });
  let shared = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); shared = true; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  if (!shared) {
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  state.lastExport = Date.now(); save(); render();
  toast("Backup exported.");
}

$("#importFile").addEventListener("change", async (ev) => {
  const f = ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  try {
    const m = migrate(JSON.parse(await f.text()));
    if (!m) throw new Error("bad file");
    if (!(await ask({ title: "Restore this backup?", body: `Everything on this phone will be replaced with the backup's ${pl(m.sessions.length, "workout")}.`, ok: "Restore", danger: true }))) return;
    m.lastExport = state.lastExport;
    state = m; ui.drafts = {}; ui.open = null; ui.detail = null; ui.workoutOpen = false;
    save(); render(); toast("Backup restored.");
  } catch (e) { toast("That file isn't a Lift Log backup. Choose a workouts-….json file."); }
});

/* Drag to reorder exercises (Workouts tab) */
let drag = null;
document.addEventListener("pointerdown", (ev) => {
  const h = ev.target.closest(".handle");
  if (!h) return;
  const li = h.closest(".erow");
  const rows = [...document.querySelectorAll("#elist .erow")];
  drag = { li, rows, from: rows.indexOf(li), to: rows.indexOf(li), startY: ev.clientY, step: li.offsetHeight + 8, id: ev.pointerId };
  li.classList.add("dragging");
  rows.forEach((r) => { if (r !== li) r.classList.add("shifting"); });
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  ev.preventDefault();
});
document.addEventListener("pointermove", (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  const n = drag.rows.length;
  const dy = Math.max(-drag.from * drag.step, Math.min((n - 1 - drag.from) * drag.step, ev.clientY - drag.startY));
  drag.li.style.transform = `translateY(${dy}px)`;
  drag.to = Math.max(0, Math.min(n - 1, drag.from + Math.round(dy / drag.step)));
  drag.rows.forEach((r, j) => {
    if (r === drag.li) return;
    let shift = 0;
    if (drag.from < drag.to && j > drag.from && j <= drag.to) shift = -drag.step;
    if (drag.from > drag.to && j < drag.from && j >= drag.to) shift = drag.step;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
});
function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  const { from, to } = drag;
  drag = null;
  if (from !== to) {
    const w = workoutById(ui.detail);
    const [moved] = w.exercises.splice(from, 1);
    w.exercises.splice(to, 0, moved);
    save();
  }
  render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && (ev.target.id === "authPw" || ev.target.id === "authEmail")) { ev.preventDefault(); signIn(ui.sd.mode); }
  if (ev.key === "Enter" && ev.target.id === "dlg-in") { ev.preventDefault(); closeDialog(true); }
  if (ev.key === "Escape" && !$("#dialog").hidden) closeDialog(false);
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "exName") { ui.sd.name = el.value; return; }
  if (el.id === "authEmail") { ui.sd.email = el.value; return; }
  if (!el.dataset.field || el.dataset.i == null) return;
  const s = activeSession(); if (!s) return;
  const e = liveExercises(s)[+el.dataset.i];
  if (e) draftFor(s, e.name)[el.dataset.field] = el.value;
});

document.addEventListener("click", async (ev) => {
  const mus = ev.target.closest(".body .mus");
  if (mus) {
    const k = mus.dataset.m, t = today(), mon = mondayOf(t);
    const n = musclesBetween(mon, addDays(mon, 6)).get(k) || 0;
    toast(`${MUSCLES[k]}: ${n ? n + " set" + (n === 1 ? "" : "s") + " this week" : "not trained yet this week"}`);
    return;
  }
  const b = ev.target.closest("[data-action]");
  if (!b) return;
  const a = b.dataset.action;
  const i = b.dataset.i != null ? +b.dataset.i : null;

  switch (a) {
    case "tab": {
      const same = ui.tab === b.dataset.tab;           // tapping the current tab again returns to its top level
      ui.tab = b.dataset.tab;
      if (ui.tab !== "workouts" || same) ui.detail = null;
      render(); window.scrollTo(0, 0); break;
    }
    case "week": ui.weekOffset += +b.dataset.d; render(); break;
    case "plan": ui.sheet = "plan"; ui.sd = { date: b.dataset.date }; renderSheet(); break;
    case "set-plan":
      if (b.dataset.id) state.plan[ui.sd.date] = b.dataset.id; else delete state.plan[ui.sd.date];
      save(); ui.sheet = null; render(); break;
    case "sheet-close": ui.sheet = null; renderSheet(); break;
    case "start": startWorkout(b.dataset.id); break;
    case "resume": openWorkout(); break;
    case "minimize": ui.workoutOpen = false; render(); break;
    case "finish": {
      const s = activeSession(); if (!s) break;
      const ok = setCount(s)
        ? await ask({ title: `Finish ${s.name}?`, body: `${pl(setCount(s), "set")} will be saved to your history.`, ok: "Finish" })
        : await ask({ title: "No sets logged", body: "There's nothing to save, so this workout will be discarded.", ok: "Discard", danger: true });
      if (!ok) break;
      finishSession(s, false); render(); break;
    }
    case "cancel-workout": {
      const s = activeSession(); if (!s) break;
      const n = setCount(s);
      const ok = await ask({ title: `Cancel ${s.name}?`, body: n ? `The ${pl(n, "set")} you logged in this workout will be deleted. This can't be undone.` : "Nothing has been logged yet.", ok: "Cancel workout", cancel: "Keep going", danger: true });
      if (!ok) break;
      state.sessions = state.sessions.filter((x) => x !== s);
      state.deleted = [...(state.deleted || []), s.id];
      stopTimer(); ui.workoutOpen = false; ui.open = null; ui.drafts = {};
      save(); render(); toast("Workout cancelled. Nothing was saved."); break;
    }
    case "dlg-ok": closeDialog(true); break;
    case "wseg": ui.wseg = b.dataset.seg; ui.detail = null; render(); break;
    case "range": ui.range = +b.dataset.r; render(); break;
    case "lift": ui.sheet = "lift"; ui.sd = { name: b.dataset.name }; renderSheet(); break;
    case "auth-open": ui.sheet = "auth"; ui.sd = { mode: "signin", email: "" }; renderSheet(); break;
    case "auth-mode": ui.sd.mode = ui.sd.mode === "signup" ? "signin" : "signup"; renderSheet(); break;
    case "auth-go": await signIn(ui.sd.mode); break;
    case "sign-out": if (await ask({ title: "Sign out?", body: "Your workouts stay on this phone and in your backup.", ok: "Sign out" })) await signOut(); break;
    case "oura-connect": await connectOura(); break;
    case "oura-sync": await ouraRefresh(true); break;
    case "oura-disconnect": await disconnectOura(); break;
    case "demo-on": state.demo = true; save(); render(); toast("Showing sample data in Recovery and Insights."); break;
    case "demo-off": state.demo = false; save(); render(); toast("Sample data off."); break;
    case "dlg-cancel": closeDialog(false); break;
    case "toast-undo": { const f = toastUndo; toastUndo = null; $("#toast").hidden = true; if (f) f(); break; }
    case "toggle": {
      ui.open = ui.open === i ? null : i; renderWorkout(); tick();
      if (ui.open != null) { const li = $("#wo-list").children[i]; if (li) li.scrollIntoView({ block: "start", behavior: "smooth" }); }
      break;
    }
    case "step": {
      const s = activeSession(); if (!s) break;
      const e = liveExercises(s)[i], d = draftFor(s, e.name), f = b.dataset.field, step = +b.dataset.d;
      const next = Math.max(0, (parseFloat(d[f]) || 0) + step);
      d[f] = f === "w" && next === 0 && step < 0 ? "" : fmtNum(next);
      const input = document.getElementById(`${f}-${i}`);
      if (input) input.value = d[f];
      break;
    }
    case "log": ensureAudio(); logSet(i); break;
    case "delset": deleteSet(i, +b.dataset.s); break;
    case "t-adj":
      timer.end += +b.dataset.d * 1000;
      if (timer.end <= Date.now()) timer.end = Date.now() + 1000;
      timer.total = Math.max(timer.total, Math.ceil((timer.end - Date.now()) / 1000));
      tick(); break;
    case "t-skip": stopTimer(); break;

    case "open-w": ui.detail = b.dataset.id; render(); window.scrollTo(0, 0); break;
    case "close-w": ui.detail = null; render(); break;
    case "new-workout": {
      const name = await ask({ title: "New workout", body: "Give it a name, like Upper or Arms.", ok: "Create", input: "" });
      if (!name) break;
      let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "workout";
      while (workoutById(id)) id += "-2";
      state.workouts.push({ id, name, exercises: [] });
      save(); ui.detail = id; render(); break;
    }
    case "rename-w": {
      const w = workoutById(ui.detail);
      const name = await ask({ title: "Rename workout", ok: "Save", input: w.name });
      if (!name) break;
      w.name = name; save(); render(); break;
    }
    case "delete-w": {
      const w = workoutById(ui.detail);
      if (!(await ask({ title: `Delete ${w.name}?`, body: "Past workouts stay in your history. Any days planned with it will be cleared.", ok: "Delete", danger: true }))) break;
      state.workouts = state.workouts.filter((x) => x !== w);
      Object.keys(state.plan).forEach((d) => { if (state.plan[d] === w.id) delete state.plan[d]; });
      ui.detail = null; save(); render(); break;
    }
    case "edit-ex": {
      const w = workoutById(ui.detail);
      const e = i >= 0 ? w.exercises[i] : null;
      ui.sheet = "exercise";
      ui.sd = { idx: i, name: e ? e.name : "", muscles: new Set(e ? e.muscles : []) };
      renderSheet();
      if (!e) setTimeout(() => { const n = $("#exName"); if (n) n.focus(); }, 50);
      break;
    }
    case "toggle-m": {
      const k = b.dataset.m;
      ui.sd.muscles.has(k) ? ui.sd.muscles.delete(k) : ui.sd.muscles.add(k);
      b.setAttribute("aria-pressed", ui.sd.muscles.has(k));
      break;
    }
    case "ex-save": {
      const w = workoutById(ui.detail);
      const name = (ui.sd.name || "").trim();
      if (!name) { toast("Give the exercise a name."); break; }
      if (w.exercises.some((x, j) => j !== ui.sd.idx && x.name.toLowerCase() === name.toLowerCase())) { toast(`${name} is already in ${w.name}.`); break; }
      const muscles = Object.keys(MUSCLES).filter((k) => ui.sd.muscles.has(k));
      if (ui.sd.idx >= 0) {
        const old = w.exercises[ui.sd.idx];
        if (old.name !== name) {
          // keep history linked to the renamed exercise
          state.sessions.forEach((s) => s.entries.forEach((e) => { if (e.exercise === old.name) e.exercise = name; }));
        }
        w.exercises[ui.sd.idx] = { name, muscles };
      } else w.exercises.push({ name, muscles });
      save(); ui.sheet = null; render(); break;
    }
    case "ex-delete": {
      const w = workoutById(ui.detail);
      const e = w.exercises[ui.sd.idx];
      if (!(await ask({ title: `Remove ${e.name}?`, body: `It comes out of ${w.name}. Its past sets stay in your history.`, ok: "Remove", danger: true }))) break;
      w.exercises.splice(ui.sd.idx, 1);
      save(); ui.sheet = null; render(); break;
    }

    case "delete-s": {
      const s = state.sessions.find((x) => x.id === b.dataset.id);
      if (!s || !(await ask({ title: `Delete this ${s.name} workout?`, body: `${fmtDate(s.date)}, ${pl(setCount(s), "set")}. This can't be undone.`, ok: "Delete", danger: true }))) break;
      state.sessions = state.sessions.filter((x) => x !== s);
      state.deleted = [...(state.deleted || []), s.id];
      save(); render(); break;
    }
    case "rest": state.restSeconds = +b.dataset.s; save(); render(); break;
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
  }
});

render();
initCloud();
</script>
